# security/sigstore/keycloak-values.yaml
# Helm configuration for Keycloak in local sigstore-system namespace.
# Hardened for PSS Restricted compliance.

production: false

image:
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0

auth:
  adminUser: admin
  adminPassword: adminpassword

http:
  relativePathway: /

service:
  type: NodePort
  ports:
    http: 80
  nodePorts:
    http: 30080

# Mount the realm import ConfigMap
extraVolumes:
  - name: realm-import
    configMap:
      name: keycloak-realm-import

extraVolumeMounts:
  - name: realm-import
    mountPath: /opt/bitnami/keycloak/data/import
    readOnly: true

extraEnvVars:
  - name: KEYCLOAK_EXTRA_ARGS
    value: "--import-realm"

# PSS Restricted Compliance
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Override PostgreSQL subchart to use bitnamilegacy repo
postgresql:
  image:
    repository: bitnamilegacy/postgresql
    tag: 16.2.0-debian-11-r8

# Increase probe delays to allow slow Quarkus build in Kind
livenessProbe:
  initialDelaySeconds: 1200
  periodSeconds: 10
readinessProbe:
  initialDelaySeconds: 180
  periodSeconds: 15

# Allocating more resources to compile Quarkus quickly
resources:
  limits:
    cpu: 1500m
    memory: 1280Mi
  requests:
    cpu: 1000m
    memory: 768Mi
