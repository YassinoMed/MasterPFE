# Core Infrastructure Dependencies Map
nodes:
  - id: "argocd"
    label: "ArgoCD"
    group: "cd"
  - id: "git-repo"
    label: "Git Repository"
    group: "source"
  - id: "vault"
    label: "HashiCorp Vault"
    group: "security"
  - id: "vault-storage"
    label: "Vault Storage Backend"
    group: "storage"
  - id: "kubernetes-api"
    label: "Kubernetes API Server"
    group: "control-plane"
  - id: "etcd"
    label: "etcd Cluster"
    group: "storage"
  - id: "cilium"
    label: "Cilium CNI"
    group: "network"
  - id: "kernel"
    label: "Linux Kernel (eBPF)"
    group: "infrastructure"
  - id: "kubelet"
    label: "Kubelet"
    group: "node"
  - id: "portal-web"
    label: "Portal Web (Frontend)"
    group: "workload"
  - id: "auth-users"
    label: "Auth Users Service"
    group: "workload"

edges:
  - from: "argocd"
    to: "git-repo"
    type: "pulls-from"
  - from: "vault"
    to: "vault-storage"
    type: "persists-to"
  - from: "kubernetes-api"
    to: "etcd"
    type: "persists-to"
  - from: "cilium"
    to: "kernel"
    type: "runs-in"
  - from: "kubelet"
    to: "kubernetes-api"
    type: "communicates-with"
  - from: "cilium"
    to: "kubernetes-api"
    type: "communicates-with"
  - from: "argocd"
    to: "kubernetes-api"
    type: "applies-to"
  - from: "auth-users"
    to: "vault"
    type: "fetches-secrets"
  - from: "portal-web"
    to: "auth-users"
    type: "calls"
  - from: "auth-users"
    to: "kubernetes-api"
    type: "hosted-on"
  - from: "portal-web"
    to: "kubernetes-api"
    type: "hosted-on"
