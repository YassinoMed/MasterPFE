# File: sonar-project.properties
# Description: Configuration de SonarQube pour l'analyse du projet SecureRAG Hub.
# Modified by: DevSecOps Agent — 2026-06-13

sonar.projectKey=securerag-hub
sonar.projectName=SecureRAG Hub
sonar.projectVersion=1.0

# Répertoires à analyser
sonar.sources=.

# Fichiers et répertoires à exclure de l'analyse
sonar.exclusions=**/vendor/**,**/node_modules/**,**/tests/**,**/storage/**,**/bootstrap/cache/**

# Fichiers de test
sonar.tests=platform/portal-web/tests,services-laravel/auth-users-service/tests,services-laravel/chatbot-manager-service/tests,services-laravel/conversation-service/tests,services-laravel/audit-security-service/tests
sonar.test.inclusions=**/tests/**

# Qualité
sonar.qualitygate.wait=true

# Rapports de couverture (PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml
