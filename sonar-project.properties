# File: sonar-project.properties
# Description: Configuration de SonarQube pour l'analyse du projet SecureRAG Hub.
# Modified by: DevSecOps Agent — 2026-06-13

sonar.projectKey=securerag-hub
sonar.projectName=SecureRAG Hub
sonar.projectVersion=1.0

# Répertoires à analyser
sonar.sources=.

# Fichiers et répertoires à exclure de l'analyse
sonar.exclusions=**/vendor/**,**/node_modules/**,**/tests/**,**/storage/**,**/bootstrap/cache/**

# Fichiers de test
sonar.tests=platform/portal-web/tests,services-laravel/auth-users-service/tests,services-laravel/chatbot-manager-service/tests,services-laravel/conversation-service/tests,services-laravel/audit-security-service/tests
sonar.test.inclusions=**/tests/**

# Qualité
sonar.qualitygate.wait=true

# Rapports de couverture (PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions de duplication (CPD) pour les fichiers configurés, de migration et de test Laravel
sonar.cpd.exclusions=**/config/**,services-laravel/*/config/*.php,platform/portal-web/config/*.php,**/database/migrations/0001_01_01_*.php,services-laravel/*/database/migrations/0001_01_01_*.php,platform/portal-web/database/migrations/0001_01_01_*.php,services-laravel/auth-users-service/database/migrations/2026_04_11_000003_create_permission_role_table.php,services-laravel/auth-users-service/database/migrations/2026_04_11_000004_create_role_user_table.php,**/database/factories/UserFactory.php,services-laravel/*/database/factories/UserFactory.php,platform/portal-web/database/factories/UserFactory.php,services-laravel/*/tests/Feature/AuthorizationSecurityTest.php,platform/portal-web/app/Support/DemoPortalData.php
# Import Semgrep SARIF
sonar.sarif.reportPaths=security/reports/semgrep.sarif
