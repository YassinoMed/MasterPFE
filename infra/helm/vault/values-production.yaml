# File: infra/helm/vault/values-production.yaml
# Description: Configuration de production pour HashiCorp Vault.
# Modified by: DevSecOps Agent — 2026-06-13

server:
  affinity: ""
  ha:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "raft" {
        path = "/vault/data"
      }

  # Configuration de l'authentification Kubernetes
  authDelegator:
    enabled: true

ui:
  enabled: false

injector:
  enabled: false
