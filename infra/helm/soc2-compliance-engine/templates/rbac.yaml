{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soc2-compliance-engine.serviceAccountName" . }}
  labels:
    {{- include "soc2-compliance-engine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "soc2-compliance-engine.fullname" . }}-role
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["clusterpolicyreports", "policyreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports", "clusterconfigauditreports", "clustervulnerabilityreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "soc2-compliance-engine.fullname" . }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "soc2-compliance-engine.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "soc2-compliance-engine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
