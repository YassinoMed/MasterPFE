# Prometheus — Helm values (Production)
# SecureRAG Hub — Observability Stack: Metrics
---
prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 10GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      - job_name: 'wazuh-exporter'
        static_configs:
          - targets:
              - 'vps-host.securerag.local:9200'
        scrape_interval: 30s
      - job_name: 'loki'
        static_configs:
          - targets: ['loki.loki.svc.cluster.local:3100']
      - job_name: 'tempo'
        static_configs:
          - targets: ['tempo.tempo.svc.cluster.local:3200']
      - job_name: 'vault'
        static_configs:
          - targets: ['vault.vault.svc.cluster.local:8200']

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: false  # We deploy Grafana separately with our custom values