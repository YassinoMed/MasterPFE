apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-governance-sa
  namespace: {{ .Values.namespace | default "ai-security" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-governance-network-policy
  namespace: {{ .Values.namespace | default "ai-security" }}
spec:
  podSelector: {} # Applies to all pods in the namespace
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic between components in the same namespace
  - from:
    - podSelector: {}
  # Allow Prometheus metrics scraping
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: securerag-monitoring
  egress:
  # Allow egress to the same namespace components
  - to:
    - podSelector: {}
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
