{{- range $name, $config := .Values.components }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace | default "ai-security" }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $config.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: ai-governance-sa
      containers:
      - name: {{ $name }}
        image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
        imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: {{ $config.service.port }}
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ $config.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ $config.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace | default "ai-security" }}
  labels:
    app: {{ $name }}
spec:
  type: {{ $config.service.type | default "ClusterIP" }}
  ports:
  - port: {{ $config.service.port }}
    targetPort: {{ $config.service.port }}
    protocol: TCP
  selector:
    app: {{ $name }}
---
{{- end }}
