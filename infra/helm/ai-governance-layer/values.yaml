# Default values for ai-governance-layer.
# This is a YAML-formatted file.

namespace: ai-security

# Base settings for components
components:
  ai-orchestrator:
    replicaCount: 1
    image:
      repository: localhost:5001/ai-security-orchestrator
      tag: production
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8091
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

