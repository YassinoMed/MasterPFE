services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securerag-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD_FILE: /run/jenkins-secrets/jenkins-admin-password
      JENKINS_URL: ${JENKINS_URL:-http://83.229.82.46:8085/}
      SECURERAG_GIT_URL: ${SECURERAG_GIT_URL:-/workspace}
      SECURERAG_GIT_BRANCH: "*/main"
      ENABLE_LOCAL_FORWARDING: "true"
      RECETTE_SSH_USER: ${RECETTE_SSH_USER:-root}
      SONAR_HOST_URL: http://host.docker.internal:9000
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_home/casc_configs:ro
      - ./jobs:/var/jenkins_home/job_dsl:ro
      - ./init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ./secrets:/run/jenkins-secrets:ro
      - ./secrets/kubeconfig:/var/jenkins_home/.kube/config:ro
      - ../../:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # [SEC-03] Removed docker.sock volume (Restored to enable Kaniko docker fallback in CI)
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - kind
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

networks:
  kind:
    external: true

volumes:
  jenkins_home:

