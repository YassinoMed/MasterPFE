jenkins:
  systemMessage: "SecureRAG Hub Jenkins - DevSecOps CI/CD reference"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

  remotingSecurity:
    enabled: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "recette-deploy-ssh-key"
              username: "${RECETTE_SSH_USER:-root}"
              description: "SSH deploy key for recette machine (63.250.59.72)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFileOrDefault:/run/jenkins-secrets/recette-deploy-key:}"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${readFileOrDefault:/run/jenkins-secrets/gmail-user:}"
  timestamper:
    allPipelines: true
  mailer:
    smtpHost: "smtp.gmail.com"
    smtpPort: "587"
    useSsl: false
    useTls: true
    replyToAddress: "${readFileOrDefault:/run/jenkins-secrets/gmail-user:}"
    authentication:
      username: "${readFileOrDefault:/run/jenkins-secrets/gmail-user:}"
      password: "${readFileOrDefault:/run/jenkins-secrets/gmail-app-password:}"

jobs:
  - file: /var/jenkins_home/job_dsl/securerag-hub-ci.groovy
  - file: /var/jenkins_home/job_dsl/securerag-hub-cd.groovy
  - file: /var/jenkins_home/job_dsl/securerag-hub-recette.groovy
