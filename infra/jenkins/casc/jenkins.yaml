jenkins:
  systemMessage: "SecureRAG Hub Jenkins - DevSecOps CI/CD reference"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard: {}


  globalNodeProperties:
    - envVars:
        env:
          - key: "SONAR_HOST_URL"
            value: "http://host.docker.internal:9000"

  remotingSecurity:
    enabled: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "recette-deploy-ssh-key"
              username: "${RECETTE_SSH_USER:-root}"
              description: "SSH deploy key for recette machine (83.229.82.46)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/jenkins-secrets/recette-deploy-key}"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube access token"
              secret: "${readFile:/run/jenkins-secrets/sonar-token}"

unclassified:
  globalLibraries:
    libraries:
      - name: "jenkins-shared-library"
        defaultVersion: "main"
        implicit: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/YassinoMed/MasterPFE.git"
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${readFile:/run/jenkins-secrets/gmail-user}"
  timestamper:
    allPipelines: true
  mailer:
    smtpHost: "smtp.gmail.com"
    smtpPort: "587"
    useSsl: false
    useTls: true
    authentication:
      username: "${readFile:/run/jenkins-secrets/gmail-user}"
      password: "${readFile:/run/jenkins-secrets/gmail-app-password}"
    replyToAddress: "${readFile:/run/jenkins-secrets/gmail-user}"

jobs:
  - file: /var/jenkins_home/job_dsl/securerag-hub-ci.groovy
  - file: /var/jenkins_home/job_dsl/securerag-hub-cd.groovy
  - file: /var/jenkins_home/job_dsl/securerag-hub-recette.groovy
