# Jenkins Kubernetes Plugin — Pod Templates
# Fichier inclus dans jenkins.yaml (CasC)
# Définit 7 pod templates pour les agents spécialisés.

jenkins:
  clouds:
    - kubernetes:
        name: "kubernetes"
        namespace: "securerag-cicd"
        serverUrl: "https://securerag-dev-control-plane:6443"
        skipTlsVerify: true
        credentialsId: "k8s-token"
        jenkinsUrl: "http://jenkins.securerag-cicd.svc:8080"
        jenkinsTunnel: "jenkins-agent.securerag-cicd.svc:50000"
        containerCapStr: "10"
        maxRequestsPerHostStr: "32"
        waitForPodSec: "600"
        podRetention: "never"
        templates:
          # ── 1. test-agent ──────────────────────────────────────────
          - name: "test-agent"
            label: "test-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "php"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-test-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "500m"
                resourceLimitCpu: "2000m"
                resourceRequestMemory: "512Mi"
                resourceLimitMemory: "2048Mi"
                envVars:
                  - envVar:
                      key: "COMPOSER_HOME"
                      value: "/tmp/composer"
                  - envVar:
                      key: "COMPOSER_CACHE_DIR"
                      value: "/tmp/composer-cache"
                  - envVar:
                      key: "npm_config_cache"
                      value: "/tmp/npm-cache"
                  - envVar:
                      key: "NPM_CONFIG_CACHE"
                      value: "/tmp/npm-cache"
            volumes:
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/composer-cache-pvc"
                  mountPath: "/tmp/composer-cache"
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/npm-cache-pvc"
                  mountPath: "/tmp/npm-cache"
              - emptyDirVolume:
                  memory: false
                  mountPath: "/tmp"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 2. security-agent ──────────────────────────────────────
          - name: "security-agent"
            label: "security-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "security"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-security-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "500m"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "512Mi"
                resourceLimitMemory: "4096Mi"
                envVars:
                  - envVar:
                      key: "TRIVY_CACHE_DIR"
                      value: "/tmp/trivy-cache"
            volumes:
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/trivy-cache-pvc"
                  mountPath: "/tmp/trivy-cache"
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/dependency-check-cache-pvc"
                  mountPath: "/tmp/dependency-check"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 3. docker-agent ────────────────────────────────────────
          - name: "docker-agent"
            label: "docker-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "docker"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-docker-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "1"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "1Gi"
                resourceLimitMemory: "4096Mi"
                envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://localhost:2375"
                  - envVar:
                      key: "TRIVY_CACHE_DIR"
                      value: "/tmp/trivy-cache"
              - name: "dind"
                image: "docker:27-dind"
                privileged: true
                resourceRequestCpu: "500m"
                resourceLimitCpu: "2000m"
                resourceRequestMemory: "512Mi"
                resourceLimitMemory: "2048Mi"
                envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
            volumes:
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/trivy-cache-pvc"
                  mountPath: "/tmp/trivy-cache"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 4. k8s-agent ───────────────────────────────────────────
          - name: "k8s-agent"
            label: "k8s-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "k8s"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-k8s-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "500m"
                resourceLimitCpu: "2000m"
                resourceRequestMemory: "512Mi"
                resourceLimitMemory: "2048Mi"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 5. sonar-agent ─────────────────────────────────────────
          - name: "sonar-agent"
            label: "sonar-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "sonar"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-sonar-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "500m"
                resourceLimitCpu: "2000m"
                resourceRequestMemory: "512Mi"
                resourceLimitMemory: "4096Mi"
                envVars:
                  - envVar:
                      key: "SONAR_USER_HOME"
                      value: "/tmp/sonar-cache"
            volumes:
              - hostPathVolume:
                  hostPath: "/var/cache/jenkins/sonar-cache-pvc"
                  mountPath: "/tmp/sonar-cache"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 6. zap-agent ───────────────────────────────────────────
          - name: "zap-agent"
            label: "zap-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "zap"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-zap-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "1"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "1Gi"
                resourceLimitMemory: "4096Mi"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"

          # ── 7. deploy-agent ────────────────────────────────────────
          - name: "deploy-agent"
            label: "deploy-agent"
            nodeUsageMode: EXCLUSIVE
            containers:
              - name: "deploy"
                # [MAJ-05] Excluded from pinning: dynamically built in CI
                image: "localhost:5001/securerag-hub-deploy-agent:latest"
                command: "sleep"
                args: "99d"
                resourceRequestCpu: "250m"
                resourceLimitCpu: "1000m"
                resourceRequestMemory: "256Mi"
                resourceLimitMemory: "1024Mi"
            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            slaveConnectTimeout: 300
            idleMinutes: 5
            yamlMergeStrategy: "override"
