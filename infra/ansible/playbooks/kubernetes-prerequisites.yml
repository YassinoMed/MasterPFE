# Ansible — Bootstrap Kubernetes prerequisites
# Prépare un nœud Debian/Ubuntu pour Kubernetes.
- name: Kubernetes Node Prerequisites
  hosts: all
  become: true

  tasks:
    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load kernel modules
      copy:
        dest: /etc/modules-load.d/kubernetes.conf
        content: |
          overlay
          br_netfilter
          ip_vs
          ip_vs_rr
          ip_vs_wrr
          ip_vs_sh

    - name: Load modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh

    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: apply sysctl

    - name: Install container runtime (containerd)
      apt:
        name:
          - containerd.io
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure containerd config
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable containerd systemd cgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Enable and start containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Hold kubelet/kubeadm/kubectl versions
      shell: apt-mark hold kubelet kubeadm kubectl
      changed_when: false

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: true

  handlers:
    - name: apply sysctl
      command: sysctl --system
