---
- name: Update apt cache and install common utilities
  apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
      - software-properties-common
      - git
      - vim
      - sysstat
      - fail2ban
    state: present
    update_cache: true

- name: Disable SWAP immediately
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable SWAP in fstab permanently
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

- name: Load overlay kernel module
  modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  modprobe:
    name: br_netfilter
    state: present

- name: Configure kernel modules to load on boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Configure sysctl parameters for Kubernetes
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
    state: present
    reload: true
  with_dict:
    net.bridge.bridge-nf-call-iptables: "1"
    net.ipv4.ip_forward: "1"
    net.bridge.bridge-nf-call-ip6tables: "1"
