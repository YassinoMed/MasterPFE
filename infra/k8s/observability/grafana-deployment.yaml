apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: securerag-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.securerag-monitoring.svc:9090
        isDefault: true
        access: proxy
      - name: Loki
        type: loki
        url: http://loki.securerag-monitoring.svc:3100
        access: proxy
      - name: Alertmanager
        type: alertmanager
        url: http://alertmanager.securerag-monitoring.svc:9093
        access: proxy
        jsonData:
          implementation: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: securerag-monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: SecureRAG
        folder: SecureRAG
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-securerag
  namespace: securerag-monitoring
data:
  securerag-overview.json: |
    {
      "title": "SecureRAG Hub — Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        { "id": 1, "type": "stat", "title": "Pods Up",
          "targets": [{ "expr": "count(up{namespace=\"securerag-hub\"} == 1)" }],
          "gridPos": {"x":0,"y":0,"w":4,"h":4} },
        { "id": 2, "type": "stat", "title": "Error rate (5m)",
          "targets": [{ "expr": "sum(rate(http_server_requests_total{namespace=\"securerag-hub\",status=~\"5..\"}[5m])) / sum(rate(http_server_requests_total{namespace=\"securerag-hub\"}[5m]))" }],
          "gridPos": {"x":4,"y":0,"w":4,"h":4} },
        { "id": 3, "type": "timeseries", "title": "p95 Latency",
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{namespace=\"securerag-hub\"}[5m])) by (service,le))" }],
          "gridPos": {"x":8,"y":0,"w":16,"h":8} },
        { "id": 4, "type": "timeseries", "title": "CPU per pod",
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"securerag-hub\"}[3m])) by (pod)" }],
          "gridPos": {"x":0,"y":8,"w":12,"h":8} },
        { "id": 5, "type": "timeseries", "title": "Memory per pod",
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"securerag-hub\"}) by (pod)" }],
          "gridPos": {"x":12,"y":8,"w":12,"h":8} }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: securerag-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboards-provider, configMap: { name: grafana-dashboards-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboard-securerag } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: securerag-monitoring
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: securerag-monitoring
type: Opaque
stringData:
  # NOTE: rotate via SOPS/age or External Secrets Operator before production.
  password: "change-me-securerag-grafana"
