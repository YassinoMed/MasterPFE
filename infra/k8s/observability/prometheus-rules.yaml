apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: securerag-monitoring
data:
  securerag-slo.yaml: |
    groups:
      - name: securerag-slo
        interval: 30s
        rules:
          # SLO 1 — Disponibilité Portal Web > 99% sur 5min
          - alert: PortalWebDown
            expr: up{service="portal-web"} == 0
            for: 2m
            labels:
              severity: critical
              service: portal-web
            annotations:
              summary: "Portal Web is down"
              description: "Pod {{ $labels.pod }} of portal-web has been unavailable for >2min."
          # SLO 2 — Latence p95 < 500ms
          - alert: HighLatencyLaravelService
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_server_request_duration_seconds_bucket{namespace="securerag-hub"}[5m]))
                by (service, le)
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.service }}"
              description: "p95 > 500ms during 5min."
          # SLO 3 — Erreur 5xx < 1%
          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_total{namespace="securerag-hub",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_total{namespace="securerag-hub"}[5m])) > 0.01
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Error rate > 1% on SecureRAG"
          # SLO 4 — CPU saturation
          - alert: PodCPUSaturation
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="securerag-hub"}[3m])) by (pod)
              / sum(kube_pod_container_resource_limits{namespace="securerag-hub",resource="cpu"}) by (pod) > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} CPU > 85% of limit"
          # SLO 5 — Memory saturation
          - alert: PodMemorySaturation
            expr: |
              sum(container_memory_working_set_bytes{namespace="securerag-hub"}) by (pod)
              / sum(kube_pod_container_resource_limits{namespace="securerag-hub",resource="memory"}) by (pod) > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} memory > 85% of limit"
          # SLO 6 — Crashloop
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="securerag-hub"}[15m]) * 60 * 15 > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} crash-looping"
              description: "More than 3 restarts in last 15min."
