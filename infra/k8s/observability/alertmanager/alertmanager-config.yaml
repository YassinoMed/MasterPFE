apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: observability
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/placeholder'

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      receiver: 'default-receiver'
      group_by: ['severity', 'alertname', 'namespace']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 4h
      routes:
        - receiver: 'critical-ops'
          matchers:
            - severity = critical
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 30m
        - receiver: 'high-severity'
          matchers:
            - severity = high
          group_wait: 1m
          group_interval: 3m
          repeat_interval: 1h
        - receiver: 'backup-alerts'
          matchers:
            - alertname =~ "VeleroBackupFailed|VeleroRestoreFailed|VeleroPartialFailure"
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: 'chaos-alerts'
          matchers:
            - severity = chaos
          group_wait: 10s
          group_interval: 30s
          repeat_interval: 1h
        - receiver: 'dr-alerts'
          matchers:
            - alertname =~ ".*DisasterRecovery|.*Failover|.*Drill"
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: 'null'
          matchers:
            - severity = none
          continue: false
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: 'default-receiver'
        slack_configs:
          - channel: '#securerag-alerts'
            title: '{{ .GroupLabels.alertname }} [{{ .GroupLabels.severity }}]'
            text: '{{ template "slack.securerag.text" . }}'
            send_resolved: true
          - channel: '#securerag-security'
            title: 'SECURITY: {{ .GroupLabels.alertname }} [{{ .GroupLabels.severity }}]'
            text: '{{ template "slack.securerag.text" . }}'
            send_resolved: true
            matchers:
              - severity =~ "critical|high"

      - name: 'critical-ops'
        slack_configs:
          - channel: '#securerag-ops'
            title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ template "slack.securerag.critical" . }}'
            send_resolved: true
        webhook_configs:
          - url: 'http://webhook-securerag.securerag-hub.svc:8080/alerts'
            send_resolved: true

      - name: 'high-severity'
        slack_configs:
          - channel: '#securerag-alerts'
            title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
            text: '{{ template "slack.securerag.text" . }}'
            send_resolved: true

      - name: 'backup-alerts'
        slack_configs:
          - channel: '#securerag-backup'
            title: '💾 {{ .GroupLabels.alertname }}'
            text: '{{ template "slack.securerag.backup" . }}'
            send_resolved: true

      - name: 'chaos-alerts'
        slack_configs:
          - channel: '#securerag-chaos'
            title: '⚡ CHAOS: {{ .GroupLabels.alertname }}'
            text: '{{ template "slack.securerag.chaos" . }}'
            send_resolved: true

      - name: 'dr-alerts'
        slack_configs:
          - channel: '#securerag-dr'
            title: '🔄 DR: {{ .GroupLabels.alertname }}'
            text: '{{ template "slack.securerag.dr" . }}'
            send_resolved: true

      - name: 'null'
        slack_configs: []

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity = high
        target_matchers:
          - severity = info
        equal: ['alertname', 'namespace']
      - source_matchers:
          - alertname = "ClusterDown"
        target_matchers:
          - alertname =~ "PodDown|DeploymentDown"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: observability
data:
  slack.tmpl: |
    {{ define "slack.securerag.text" }}
    *Alert:* {{ .GroupLabels.alertname }}
    *Severity:* {{ .GroupLabels.severity }}
    *Namespace:* {{ .GroupLabels.namespace }}
    *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
    *Summary:* {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
    *Graph:* <{{ .ExternalURL }}|View in Alertmanager>
    {{ end }}

    {{ define "slack.securerag.critical" }}
    🚨 *CRITICAL ALERT* 🚨
    *Alert:* {{ .GroupLabels.alertname }}
    *Namespace:* {{ .GroupLabels.namespace }}
    *Pod:* {{ range .Alerts }}{{ .Labels.pod }}{{ end }}
    *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
    *Runbook:* {{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}
    *Action:* Immediate investigation required. Check {{ .ExternalURL }}
    {{ end }}

    {{ define "slack.securerag.backup" }}
    *Backup Status Update*
    *Alert:* {{ .GroupLabels.alertname }}
    *Namespace:* {{ .GroupLabels.namespace }}
    *Time:* {{ range .Alerts }}{{ .StartsAt }}{{ end }}
    *Action:* {{ if eq .GroupLabels.alertname "VeleroBackupFailed" }}Check velero logs: kubectl logs -n velero deployment/velero{{ else }}Verify backup status: velero backup get{{ end }}
    {{ end }}

    {{ define "slack.securerag.chaos" }}
    *Chaos Experiment*
    *Alert:* {{ .GroupLabels.alertname }}
    *Experiment:* {{ .GroupLabels.namespace }}
    *Status:* {{ range .Alerts }}{{ .Annotations.status }}{{ end }}
    {{ end }}

    {{ define "slack.securerag.dr" }}
    *Disaster Recovery Event*
    *Alert:* {{ .GroupLabels.alertname }}
    *Action Required:* {{ range .Alerts }}{{ .Annotations.action }}{{ end }}
    *Runbook:* {{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}
    {{ end }}
