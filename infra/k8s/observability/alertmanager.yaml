apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: securerag-monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/T_YOUR_WORKSPACE_ID/B_YOUR_CHANNEL_ID/YOUR_TOKEN_VALUE"
    route:
      receiver: securerag-default
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [severity="critical"]
          receiver: securerag-critical
          continue: true
        - matchers: [category="runtime"]
          receiver: securerag-runtime
        - matchers: [category="admission"]
          receiver: securerag-admission
    receivers:
      - name: securerag-default
        webhook_configs:
          - url: "http://alertmanager-webhook.securerag-monitoring.svc.cluster.local:9095/alert"
            send_resolved: true
            max_alerts: 10
        slack_configs:
          - channel: "#securerag-ops"
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true
      - name: securerag-critical
        webhook_configs:
          - url: "http://alertmanager-webhook.securerag-monitoring.svc.cluster.local:9095/critical"
            send_resolved: true
        slack_configs:
          - channel: "#securerag-critical"
            title: '🚨 {{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true
      - name: securerag-runtime
        webhook_configs:
          - url: "http://alertmanager-webhook.securerag-monitoring.svc.cluster.local:9095/runtime"
            send_resolved: true
      - name: securerag-admission
        webhook_configs:
          - url: "http://alertmanager-webhook.securerag-monitoring.svc.cluster.local:9095/admission"
            send_resolved: true
    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: [namespace, service]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: securerag-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alertmanager }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{ name: http, containerPort: 9093 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
      volumes:
        - { name: config, configMap: { name: alertmanager-config } }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: securerag-monitoring
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: 9093 }]
