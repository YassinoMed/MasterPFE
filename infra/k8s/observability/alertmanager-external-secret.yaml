apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: securerag-monitoring
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: securerag/observability
        property: slack-webhook-url
    - secretKey: pagerduty-routing-key
      remoteRef:
        key: securerag/observability
        property: pagerduty-routing-key
