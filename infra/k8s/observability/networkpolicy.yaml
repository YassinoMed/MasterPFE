# NetworkPolicies : isolation namespace observabilité.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: securerag-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-internal
  namespace: securerag-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { name: securerag-monitoring }
        - namespaceSelector:
            matchLabels: { name: securerag-hub }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { name: securerag-monitoring }
        - namespaceSelector:
            matchLabels: { name: securerag-hub }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
    # Egress DNS
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Egress HTTPS (kube-apiserver)
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
