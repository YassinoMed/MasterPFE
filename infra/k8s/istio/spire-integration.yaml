# Integration of Istio with SPIRE via SDS (Secret Discovery Service)
# This EnvoyFilter configures the Istio proxy to fetch its TLS certificates 
# from the local SPIRE Agent Unix Domain Socket instead of Istiod.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: spire-sds-integration
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/component: service-mesh
  configPatches:
  - applyTo: CLUSTER
    match:
      context: SIDECAR_OUTBOUND
    patch:
      operation: ADD
      value:
        name: "spire_agent_sds"
        connect_timeout: 0.25s
        http2_protocol_options: {}
        load_assignment:
          cluster_name: "spire_agent_sds"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  pipe:
                    path: "/run/spire/sockets/agent.sock"
---
# We also need to patch the Istio mesh config to use this SDS cluster
# Usually done via IstioOperator, but we represent it here as a ConfigMap patch
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-spire-patch
  namespace: istio-system
data:
  mesh: |-
    defaultConfig:
      proxyMetadata:
        # Disable Istio's default CA
        ISTIO_META_TLS_CLIENT_CERT_CHAIN: "/run/spire/sockets/agent.sock"
        ISTIO_META_TLS_CLIENT_KEY: "/run/spire/sockets/agent.sock"
        ISTIO_META_TLS_CLIENT_ROOT_CERT: "/run/spire/sockets/agent.sock"
