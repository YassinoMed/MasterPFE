# Tetragon — eBPF Runtime Security (Cilium)
# Complète Falco : politiques au niveau noyau (LSM BPF)
# Nécessite : kernel >= 5.4, capabilities BPF (privileged nécessaire pour eBPF)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tetragon
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tetragon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tetragon
subjects:
- kind: ServiceAccount
  name: tetragon
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tetragon
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cilium.io"]
  resources: ["tracingpolicies", "tracingpolicies/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list"]
---
# CRD TracingPolicy — la ressource qui manquait à l'audit
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tracingpolicies.cilium.io
spec:
  group: cilium.io
  scope: Cluster
  names:
    plural: tracingpolicies
    singular: tracingpolicy
    kind: TracingPolicy
    shortNames: [tp]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tetragon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tetragon
    spec:
      serviceAccountName: tetragon
      hostNetwork: true
      hostPID: true
      # eBPF exige privileged (LSM BPF + accès /sys/kernel)
      tolerations:
      - operator: Exists
      containers:
      - name: tetragon
        image: localhost:5001/tetragon:v1.5.0
        securityContext:
          privileged: true
        volumeMounts:
        - name: bpf-maps
          mountPath: /sys/fs/bpf
        - name: kernel-src
          mountPath: /sys/kernel
          readOnly: true
        - name: proc
          mountPath: /proc
        - name: cilium-bpf
          mountPath: /run/cilium/tetragon
      volumes:
      - name: bpf-maps
        hostPath: {path: /sys/fs/bpf, type: Directory}
      - name: kernel-src
        hostPath: {path: /sys/kernel, type: Directory}
      - name: proc
        hostPath: {path: /proc, type: Directory}
      - name: cilium-bpf
        hostPath: {path: /run/cilium, type: DirectoryOrCreate}
