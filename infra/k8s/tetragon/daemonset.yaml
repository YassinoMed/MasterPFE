# Tetragon — eBPF Runtime Security (complements Falco)
# Namespace: kube-system (DaemonSet)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tetragon
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: tetragon }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tetragon }
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: tetragon
          image: quay.io/cilium/tetragon:v1.2.0
          securityContext:
            privileged: true
          env:
            - name: TETRAGON_EXPORT_FILENAME
              value: "tcp://otel-collector.otel-system.svc:4317"
          volumeMounts:
            - { name: bpf, mountPath: /sys/fs/bpf }
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            - { name: proc, mountPath: /proc, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: bpf, hostPath: { path: /sys/fs/bpf } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
        - { name: proc, hostPath: { path: /proc } }

