# Tetragon — eBPF Runtime Security (complements Falco)
# Namespace: kube-system (DaemonSet)
# Feature flag: ENABLE_TETRAGON=false
# CONSERVE Falco — ne supprime PAS.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tetragon
    feature.securerag.dev/enable-tetragon: "false"
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: tetragon }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tetragon }
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: tetragon
          image: quay.io/cilium/tetragon:latest
          securityContext:
            privileged: true
          env:
            - name: TETRAGON_EXPORT_FILENAME
              value: "tcp://otel-collector.otel-system.svc:4317"
          volumeMounts:
            - { name: bpf, mountPath: /sys/fs/bpf }
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            - { name: proc, mountPath: /proc, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: bpf, hostPath: { path: /sys/fs/bpf } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup } }
        - { name: proc, hostPath: { path: /proc } }

---
# Tetragon TracingPolicy — detect exec, network, file access
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: securerag-tetragon-policy
  annotations:
    feature.securerag.dev/enable-tetragon: "false"
spec:
  kprobes:
    - call: "fd_install"
      syscall: false
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "file"
      selectors:
        - matchBinaries:
            - operator: "In"
              values: ["/usr/local/bin/php", "/usr/sbin/nginx"]
