apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-deny-all"
spec:
  description: "Default deny all ingress and egress across the entire cluster"
  endpointSelector:
    matchExpressions:
      # Exclude kube-system namespace from default deny to prevent breaking core cluster functions
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - cilium
  ingress:
  - {}
  egress:
  - {}
