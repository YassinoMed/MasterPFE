---
# File: infra/k8s/network-policies/03-allow-harbor.yaml
# Description: Stratégie NetworkPolicy autorisant l'accès à Harbor OCI Registry.
# Modified by: DevSecOps Agent — 2026-06-13

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-harbor-egress
  namespace: securerag-hub
  labels:
    app.kubernetes.io/managed-by: devsecops-agent
    app.kubernetes.io/part-of: securerag-hub
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
