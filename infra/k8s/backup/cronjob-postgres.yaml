apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: securerag-backup
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  # Daily 02:30 UTC, with retention handled via the script (keep last 14).
  schedule: "30 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              image: postgres:16.4-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: securerag-database-secrets
                      key: DB_HOST
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: securerag-database-secrets
                      key: DB_PORT
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: securerag-database-secrets
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: securerag-database-secrets
                      key: DB_PASSWORD
                - name: PGSSLMODE
                  valueFrom:
                    secretKeyRef:
                      name: securerag-database-secrets
                      key: DB_SSLMODE
                - name: BACKUP_RETENTION
                  value: "14"
                - name: BACKUP_DIR
                  value: /backup
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="${BACKUP_DIR}/securerag-${ts}.sql.gz"
                  echo "[INFO] dumping PostgreSQL to ${out}"
                  for db in portal_web auth_users chatbot_manager conversation_service audit_security_service; do
                    echo "[INFO] -> database ${db}"
                    pg_dump --format=custom --compress=9 --no-owner --no-acl \
                      --dbname="${db}" \
                      > "${BACKUP_DIR}/securerag-${db}-${ts}.dump"
                  done
                  pg_dumpall --globals-only > "${BACKUP_DIR}/securerag-globals-${ts}.sql"
                  gzip -9 "${BACKUP_DIR}/securerag-globals-${ts}.sql"
                  # Manifest
                  ( cd "${BACKUP_DIR}" && \
                    sha256sum securerag-*-${ts}* > "manifest-${ts}.sha256" )
                  echo "[INFO] retention: keep last ${BACKUP_RETENTION} timestamps"
                  ls -1t "${BACKUP_DIR}"/manifest-*.sha256 \
                    | awk -v keep="${BACKUP_RETENTION}" 'NR>keep' \
                    | while read -r m; do
                        ts_old="$(basename "${m}" | sed 's/manifest-\(.*\)\.sha256/\1/')"
                        echo "[INFO] purging ${ts_old}"
                        rm -f "${BACKUP_DIR}"/securerag-*-"${ts_old}"* "${m}"
                      done
                  echo "[OK] backup complete: ${ts}"
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 1, memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: data, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: postgres-backup-data }
            - name: tmp
              emptyDir: {}
