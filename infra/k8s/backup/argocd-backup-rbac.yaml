apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: securerag-backup
  labels:
    app.kubernetes.io/name: argocd-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: securerag-backup-argocd
  labels:
    app.kubernetes.io/name: argocd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server
subjects:
- kind: ServiceAccount
  name: argocd-server
  namespace: securerag-backup
