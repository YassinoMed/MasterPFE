apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: securerag-backup
  labels:
    app.kubernetes.io/name: argocd-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: securerag-backup-argocd-reader
  labels:
    app.kubernetes.io/name: argocd-backup
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["argoproj.io"]
  resources: ["applications", "appprojects", "applicationsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: securerag-backup-argocd
  labels:
    app.kubernetes.io/name: argocd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: securerag-backup-argocd-reader
subjects:
- kind: ServiceAccount
  name: argocd-server
  namespace: securerag-backup
