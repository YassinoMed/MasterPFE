apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-data
  namespace: securerag-backup
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  # storageClassName intentionally unset: relies on cluster default to remain
  # portable across kind / managed clusters.
