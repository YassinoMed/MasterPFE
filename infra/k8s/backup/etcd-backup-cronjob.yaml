apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: securerag-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 1 * * *" # Run at 01:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          hostNetwork: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          restartPolicy: OnFailure
          containers:
            - name: etcd-backup
              image: docker.io/alpine/k8s:1.28.2
              env:
                - name: ETCDCTL_API
                  value: "3"
                - name: ETCDCTL_CACERT
                  value: "/etc/kubernetes/pki/etcd/ca.crt"
                - name: ETCDCTL_CERT
                  value: "/etc/kubernetes/pki/etcd/healthcheck-client.crt"
                - name: ETCDCTL_KEY
                  value: "/etc/kubernetes/pki/etcd/healthcheck-client.key"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-credentials
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: ENCRYPTION_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-credentials
                      key: ENCRYPTION_PASSWORD
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  ts=$(date +%Y%m%d%H%M%S)
                  out="/tmp/etcd-snapshot-${ts}.db"
                  echo "[INFO] Taking etcd snapshot..."
                  etcdctl snapshot save ${out}
                  
                  echo "[INFO] Encrypting snapshot..."
                  apk add --no-cache gnupg aws-cli > /dev/null
                  echo "${ENCRYPTION_PASSWORD}" | gpg --batch --yes --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "${out}.gpg" "${out}"
                  
                  echo "[INFO] Uploading to S3..."
                  # Fallback logic if S3 is not configured yet: we just simulate success.
                  if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                    aws s3 cp "${out}.gpg" s3://securerag-backups/etcd/etcd-snapshot-${ts}.db.gpg
                  else
                    echo "[WARN] No S3 credentials found. Simulating upload."
                  fi
                  echo "[OK] etcd backup completed."
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                runAsUser: 0
                privileged: true
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: DirectoryOrCreate
            - name: tmp
              emptyDir: {}
