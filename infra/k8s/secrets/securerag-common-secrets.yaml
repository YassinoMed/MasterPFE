apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: securerag-common-secrets
  namespace: securerag-hub
  labels:
    app.kubernetes.io/managed-by: devsecops-agent
    app.kubernetes.io/part-of: securerag-hub
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: securerag-common-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: securerag/common-secrets
        property: APP_KEY
    - secretKey: APP_SECRET_KEY
      remoteRef:
        key: securerag/common-secrets
        property: APP_SECRET_KEY
    - secretKey: COSIGN_PASSWORD
      remoteRef:
        key: securerag/common-secrets
        property: COSIGN_PASSWORD
    - secretKey: DB_PASSWORD
      remoteRef:
        key: securerag/common-secrets
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: securerag/common-secrets
        property: JWT_SECRET
    - secretKey: SECURERAG_SHARED_API_TOKEN
      remoteRef:
        key: securerag/common-secrets
        property: SECURERAG_SHARED_API_TOKEN
