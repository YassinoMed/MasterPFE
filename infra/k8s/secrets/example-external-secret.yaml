---
# File: infra/k8s/secrets/example-external-secret.yaml
# Description: ExternalSecret d'exemple pour récupérer les identifiants
# de base de données depuis Vault.
# Modified by: DevSecOps Agent — 2026-06-13

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials-es
  namespace: securerag-hub
  labels:
    app.kubernetes.io/managed-by: devsecops-agent
    app.kubernetes.io/part-of: securerag-hub
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: database/credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: database/credentials
        property: password
