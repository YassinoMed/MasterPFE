---
# File: infra/k8s/secrets/eso-cluster-secret-store.yaml
# Description: ClusterSecretStore pour External Secrets Operator,
# lié à Vault via l'authentification Kubernetes.
# Modified by: DevSecOps Agent — 2026-06-13

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/managed-by: devsecops-agent
    app.kubernetes.io/part-of: securerag-hub
spec:
  provider:
    vault:
      server: "http://securerag-vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-cluster-role"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
