# Application Argo CD pour l'overlay 'production' (HA Laravel + digests).
#
# ⚠️  IMPORTANT — targetRevision: main
#     Seuls les commits mergés sur la branche `main` du repo GitHub sont
#     considérés par Argo CD. Toute modification appliquée sur une branche
#     feature/topic (ex: claude/intelligent-kirch-*) n'arrive en prod
#     qu'après PR mergée. Vérifier avant la soutenance que la branche démo
#     est bien `main`, ou créer un overlay de démo dédié.
#
# Sync MANUEL : approbation explicite requise pour production.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securerag-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: PruneLast=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securerag-hub
  source:
    repoURL: git://172.18.0.1/securerag-hub-gitops
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: securerag-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # HPA ajuste replicas hors-Argo : ne pas considérer comme drift.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 20
