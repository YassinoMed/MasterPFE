# Root Application — SecureRAG Hub (App of Apps)
# Ce fichier est le SEUL manifeste à appliquer après l'installation d'ArgoCD.
# ArgoCD déploie automatiquement toutes les sous-applications.
#
# Bootstrap :
#   kubectl apply -f infra/k8s/argocd/application-root.yaml
#
# Après application, ArgoCD auto-sync cette root app, qui déploie :
#   1. project.yaml (AppProject)
#   2. applicationset-platform.yaml (ApplicationSet → 7 apps plateforme)
#   3. application-demo.yaml (demo overlay)
#   4. application-production.yaml (production overlay)
#   5. Les apps plateforme déploient : observability, backup, runtime-detection,
#      kyverno, kyverno-policies, metrics-server, secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securerag-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YassinoMed/MasterPFE.git
    targetRevision: main
    path: infra/k8s/argocd
    directory:
      recurse: false
      include: '*.yaml'
      exclude: 'kustomization.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
