# Template : le vrai webhook Slack doit être stocké dans Vault, pas dans git.
# 
# Configuration via Vault (Phase 3) :
#   vault kv put secret/securerag/notifications \
#     slack-webhook-url="https://hooks.slack.com/services/TXXXX/BXXXX/XXXX"
#
# Puis ESO le synchronise automatiquement dans le secret K8s.
#
# Pour configurer manuellement (temporaire) :
#   kubectl patch secret argocd-notifications-secret -n argocd \
#     --type merge -p '{"stringData":{"slack-webhook-url":"https://hooks.slack.com/services/YOUR/WEBHOOK/HERE"}}'
#
# RAPPEL : ne JAMAIS commiter le vrai webhook dans git (règle absolue).
---
# Ce fichier est un template documentaire, pas un secret réel.
# Le secret K8s argocd-notifications-secret est géré par ESO/Vault.
