# AppProject SecureRAG : isole les Applications GitOps de SecureRAG Hub.
# Whitelist source repos + namespaces + cluster destinations.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: securerag-hub
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "SecureRAG Hub — Laravel platform GitOps project"
  sourceRepos:
    - https://github.com/YassinoMed/MasterPFE.git
    - https://github.com/argoproj/argo-helm
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://helm.harbor.io
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: securerag-hub
    - server: https://kubernetes.default.svc
      namespace: securerag-monitoring
    - server: https://kubernetes.default.svc
      namespace: securerag-backup
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: postgresql
    - server: https://kubernetes.default.svc
      namespace: wazuh
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: otel-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: Policy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: velero.io
      kind: BackupStorageLocation
    - group: velero.io
      kind: VolumeSnapshotLocation
    - group: apiregistration.k8s.io
      kind: APIService
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: read-only
      description: "Read-only access for auditors"
      policies:
        - p, proj:securerag-hub:read-only, applications, get, securerag-hub/*, allow
        - p, proj:securerag-hub:read-only, applications, sync, securerag-hub/*, deny
