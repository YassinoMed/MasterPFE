# ApplicationSet — Data & Backup (PostgreSQL backup, Velero)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-data-backup
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: backup
            path: infra/k8s/backup
            namespace: securerag-backup
            wave: "40"
          - name: chaos
            path: infra/k8s/chaos
            namespace: litmus
            wave: "60"
  template:
    metadata:
      name: 'securerag-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: securerag-hub
      source:
        repoURL: https://github.com/YassinoMed/MasterPFE.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
