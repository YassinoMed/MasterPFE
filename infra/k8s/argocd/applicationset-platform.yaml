# ApplicationSet : génère les Applications de la plateforme transverse
# (observabilité, backup, runtime-detection) à partir d'une matrice statique.
# Permet d'ajouter/retirer un addon en éditant un seul fichier.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: observability
            path: infra/k8s/observability
            namespace: securerag-monitoring
            wave: "30"
          - name: backup
            path: infra/k8s/backup
            namespace: securerag-backup
            wave: "40"
          - name: runtime-detection
            path: infra/k8s/runtime-detection
            namespace: falco
            wave: "50"
          - name: kyverno
            path: infra/k8s/addons/kyverno
            namespace: kyverno
            wave: "5"
          - name: kyverno-policies
            path: infra/k8s/policies/kyverno
            namespace: kyverno
            wave: "6"
          - name: metrics-server
            path: infra/k8s/addons/metrics-server
            namespace: kube-system
            wave: "10"
          - name: secrets
            path: infra/k8s/secrets
            namespace: external-secrets
            wave: "15"
  template:
    metadata:
      name: 'securerag-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: securerag-hub
      source:
        repoURL: git://172.18.0.1/securerag-hub-gitops
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
