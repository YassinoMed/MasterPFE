# ApplicationSet — Runtime Security (Falco, Falcosidekick, Falco Talon)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-runtime-security
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: runtime-detection
            path: infra/k8s/runtime-detection
            namespace: falco
            wave: "50"
          - name: falco-talon
            path: infra/k8s/falco-talon
            namespace: falco
            wave: "55"
  template:
    metadata:
      name: 'securerag-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: securerag-hub
      source:
        repoURL: https://github.com/YassinoMed/MasterPFE.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
