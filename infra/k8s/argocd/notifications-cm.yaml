# Argo CD notifications (P1-15) — drift detection + sync events.
# Branche les triggers vers Slack/Teams via webhook (URL en Secret).
#
# Activer le contrôleur :
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj-labs/argocd-notifications/master/manifests/install.yaml
# (déjà disponible nativement dans Argo CD ≥ 2.5)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.slack: |
    url: $slack-webhook-url   # défini dans argocd-notifications-secret
    headers:
      - name: Content-Type
        value: application/json

  template.app-out-of-sync: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": ":warning: *Argo CD drift detected*\n*App:* {{.app.metadata.name}}\n*Sync:* {{.app.status.sync.status}}\n*Health:* {{.app.status.health.status}}\n*Revision:* {{.app.status.sync.revision}}"
          }

  template.app-sync-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": ":x: *Argo CD sync FAILED*\n*App:* {{.app.metadata.name}}\n*Operation:* {{.app.status.operationState.message}}"
          }

  template.app-deployed: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": ":white_check_mark: *Argo CD app deployed*\n*App:* {{.app.metadata.name}}\n*Revision:* {{.app.status.sync.revision}}"
          }

  template.app-degraded: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": ":fire: *Argo CD app DEGRADED*\n*App:* {{.app.metadata.name}}\n*Health:* {{.app.status.health.status}}"
          }

  trigger.on-sync-status-unknown: |
    - description: Application status is Unknown
      send: [app-out-of-sync]
      when: app.status.sync.status == 'Unknown'

  trigger.on-out-of-sync: |
    - description: Application drift detected
      send: [app-out-of-sync]
      when: app.status.sync.status == 'OutOfSync'

  trigger.on-sync-failed: |
    - description: Sync operation failed
      send: [app-sync-failed]
      when: app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-deployed: |
    - description: Application is healthy and synced
      send: [app-deployed]
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'

  trigger.on-health-degraded: |
    - description: Application has degraded
      send: [app-degraded]
      when: app.status.health.status == 'Degraded'

  subscriptions: |
    - recipients: [slack]
      triggers:
        - on-out-of-sync
        - on-sync-status-unknown
        - on-sync-failed
        - on-health-degraded
        - on-deployed

