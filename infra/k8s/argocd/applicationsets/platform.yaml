# ApplicationSet: Platform Services
# Deploys Vault, Harbor, ESO, cert-manager via Helm
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - name: vault
            namespace: vault
            path: infra/helm/vault
            wave: "3"
            helmValueFiles: "values-production.yaml"
          - name: harbor
            namespace: harbor
            path: infra/helm/harbor
            wave: "4"
            helmValueFiles: "values-production.yaml"
          - name: external-secrets
            namespace: external-secrets
            path: infra/helm/external-secrets
            wave: "5"
            helmValueFiles: "values-production.yaml"
  template:
    metadata:
      name: 'platform-{{name}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
        notifications.argoproj.io/subscribe.on-sync-failed.slack: securerag-alerts
        notifications.argoproj.io/subscribe.on-health-degraded.slack: securerag-alerts
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-services
      source:
        repoURL: https://github.com/YassinoMed/MasterPFE.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: ""
          kind: Secret
          jsonPointers:
            - /data
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      revisionHistoryLimit: 10
