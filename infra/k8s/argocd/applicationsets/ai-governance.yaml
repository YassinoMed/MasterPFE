# ApplicationSet: AI Security Service (v2)
# Deploys the new 4-layer AI Security Pipeline
# Replaces the legacy ai-governance-layer (orchestrator, risk, trust, etc.)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-ai-governance
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - name: ai-security-service
            namespace: ai-security
            path: ai-security-service/k8s
            wave: "20"
  template:
    metadata:
      name: 'ai-{{name}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
        notifications.argoproj.io/subscribe.on-sync-failed.slack: securerag-alerts
        notifications.argoproj.io/subscribe.on-health-degraded.slack: securerag-alerts
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: ai-services
      source:
        repoURL: https://github.com/YassinoMed/MasterPFE.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      revisionHistoryLimit: 10
