# ApplicationSet: Security Stack
# Deploys Kyverno policies, Falco, Falco Talon, network policies
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: securerag-security
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - name: kyverno-policies
            namespace: kyverno
            path: infra/k8s/policies/kyverno
            wave: "2"
          - name: falco-talon
            namespace: falco
            path: infra/k8s/falco-talon
            wave: "8"
          - name: network-policies
            namespace: securerag-hub
            path: infra/k8s/network-policies
            wave: "3"
  template:
    metadata:
      name: 'security-{{name}}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
        notifications.argoproj.io/subscribe.on-sync-failed.slack: securerag-alerts
        notifications.argoproj.io/subscribe.on-health-degraded.slack: securerag-alerts
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: security
      source:
        repoURL: https://github.com/YassinoMed/MasterPFE.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 10
