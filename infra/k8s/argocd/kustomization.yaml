apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Déploiement Argo CD pour SecureRAG Hub.
# 1. Installer le contrôleur Argo CD (v2.10+) avant d'appliquer ce kustomize.
# 2. Puis: kubectl apply -k infra/k8s/argocd
namespace: argocd
resources:
  - namespace.yaml
  - project.yaml
  - application-demo.yaml
  - application-production.yaml
  - applicationset-platform.yaml
  - notifications-cm.yaml         # P1-15 drift notifications
commonLabels:
  app.kubernetes.io/part-of: securerag-hub
  app.kubernetes.io/managed-by: argocd
