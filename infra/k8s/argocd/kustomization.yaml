apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Déploiement Argo CD pour SecureRAG Hub.
# Appliqué automatiquement par la Root Application (app-of-apps).
namespace: argocd
resources:
  - namespace.yaml
  - project.yaml
  - application-root.yaml
  # Les Applications securerag-demo / securerag-production sont générées par
  # l'ApplicationSet securerag-all-services (ownerRef vérifié) — les fichiers
  # standalone créaient une double définition conflictuelle (deux gestionnaires
  # pour la même Application). Fichiers conservés comme référence/documention.
  - applicationset-platform.yaml
  - applicationset-all.yaml
  - application-harbor.yaml
  - application-vault.yaml
  - application-eso.yaml
  - application-velero.yaml
  - notifications-cm.yaml         # P1-15 drift notifications
  - rbac-cm.yaml                  # RBAC roles (admin, auditor, developer, platform-team)
  - argocd-cm.yaml                # ArgoCD config (repo credentials, CMP, status badge)
  - application-ingress-nginx.yaml  # Ingress + TLS (P2 sécurité)
  - application-pki.yaml           # ClusterIssuer TLS
  - application-image-updater.yaml # Automatic image updates
