# AppProject: Platform Services — isolates infrastructure components.
# Scope: Vault, Harbor, External Secrets Operator, cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Platform infrastructure services — Vault, Harbor, ESO, cert-manager"
  sourceRepos:
    - https://github.com/YassinoMed/MasterPFE.git
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://helm.goharbor.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: cert-manager
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: platform-admin
      description: "Full access to platform services"
      policies:
        - p, proj:platform-services:platform-admin, applications, *, platform-services/*, allow
    - name: read-only
      description: "Read-only access for auditors"
      policies:
        - p, proj:platform-services:read-only, applications, get, platform-services/*, allow
        - p, proj:platform-services:read-only, applications, sync, platform-services/*, deny
