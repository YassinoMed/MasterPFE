# SPIRE Controller-Manager — déploiement SÉPARÉ du serveur
# (Phase 8 l'avait retiré du pod serveur pour stabiliser ; l'architecture
# correcte = deployment dédié, il installe et réconcilie les CRDs SPIFFE)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterspiffeids.spiffeid.spiffe.io
  labels:
    app.kubernetes.io/name: spire-controller-manager
spec:
  group: spiffeid.spiffe.io
  scope: Cluster
  names:
    plural: clusterspiffeids
    singular: clusterspiffeid
    kind: ClusterSPIFFEID
    shortNames: [cspiffeid]
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              spiffeIdTemplate:
                type: string
              podSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              namespaceSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              parentId:
                type: string
              dnsNameTemplates:
                type: array
                items: {type: string}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-controller-manager
rules:
- apiGroups: [""]
  resources: [pods, namespaces, nodes]
  verbs: [get, list, watch]
- apiGroups: ["spiffeid.spiffe.io"]
  resources: [clusterspiffeids, spiffeids, clusterfederations, clusterstaticentries]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ["spiffeid.spiffe.io"]
  resources: [clusterspiffeids/status]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-controller-manager
subjects:
- kind: ServiceAccount
  name: spire-controller-manager
  namespace: spire-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-controller-manager
  namespace: spire-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-controller-manager
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-controller-manager
    spec:
      serviceAccountName: spire-controller-manager
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: kind-registry.registry.svc.cluster.local:5001/spire-controller-manager:0.4.0
        command: ["/spire-controller-manager"]
        args:
        - --webhook-cert-path=/certs
        - --server-address=spire-server.spire-system.svc:8081
        - --leader-elect=false
        - --metrics-bind-address=:8080
        - --health-addr=:8082
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: 8082}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8082}
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet: {path: /healthz, port: 8082}
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 20
