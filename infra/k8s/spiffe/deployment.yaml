# SPIFFE/SPIRE — Workload Identity (Zero Trust)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire-system
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire-system
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
  selector:
    app: spire-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-server
  namespace: spire-system
  labels:
    app: spire-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: spire-server }
  template:
    metadata:
      labels: { app: spire-server }
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.8.2
          args:
            - "-config"
            - "/run/spire/config/server.conf"
          ports:
            - { containerPort: 8081, name: grpc }
          volumeMounts:
            - { name: spire-config, mountPath: /run/spire/config, readOnly: true }
            - { name: spire-data, mountPath: /run/spire/data }
        - name: spire-controller-manager
          image: ghcr.io/spiffe/spire-controller-manager:0.4.0
          args:
            - "--config"
            - "/run/spire/config/controller-manager.conf"
          volumeMounts:
            - { name: spire-data, mountPath: /run/spire/data }
      volumes:
        - { name: spire-config, configMap: { name: spire-server-config } }
        - { name: spire-data, emptyDir: {} }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire-system
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels: { app: spire-agent }
  template:
    metadata:
      labels: { app: spire-agent }
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spire-agent
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.8.2
          args: ["-config", "/run/spire/config/agent.conf"]
          volumeMounts:
            - { name: spire-config, mountPath: /run/spire/config, readOnly: true }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets }
            - { name: spire-bundle, mountPath: /run/spire/bundle }
            - { name: spire-agent-psat, mountPath: /var/run/secrets/tokens }
      volumes:
        - { name: spire-config, configMap: { name: spire-agent-config } }
        - { name: spire-agent-socket, hostPath: { path: /run/spire/sockets, type: DirectoryOrCreate } }
        - { name: spire-bundle, configMap: { name: spire-bundle, optional: true } }
        - name: spire-agent-psat
          projected:
            sources:
            - serviceAccountToken:
                path: spire-agent
                expirationSeconds: 7200
                audience: spire-server
