---
# Fichier : infra/k8s/monitoring/infra-alerts.yaml
# Alertes d'infrastructure pour le disque, les OOMKills et le réseau.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infra-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: securerag-hub
spec:
  groups:
    - name: infra.alerts
      rules:
        - alert: DiskSpaceWarning
          expr: >-
            (node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}) < 0.20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Espace disque bas (< 20%) sur la racine"

        - alert: DiskSpaceCritical
          expr: >-
            (node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}) < 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Espace disque critique (< 10%) sur la racine"

        - alert: DiskInodesWarning
          expr: >-
            (node_filesystem_files_free{mountpoint="/"}
            /
            node_filesystem_files{mountpoint="/"}) < 0.20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Nombre d'inodes libres bas (< 20%) sur la racine"

        - alert: PodOOMKilled
          expr: >-
            increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} tué par OOM — revoir les limites mémoire"

        - alert: NodeNetworkSaturation
          expr: >-
            rate(node_network_receive_bytes_total{device!="lo"}[5m]) > 1e8
            or
            rate(node_network_transmit_bytes_total{device!="lo"}[5m]) > 1e8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Bande passante réseau au-dessus de 100MB/s sur le nœud"
