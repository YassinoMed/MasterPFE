# Ratify — Vérification d'artefacts OCI 1.1 à l'admission (Gatekeeper)
# Alternative à l'ImageValidatingPolicy Kyverno pour la vérification de
# signatures Cosign + SBOM + SLSA provenance (spec OCI 1.1)
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: verifiers.config.ratify.dev
spec:
  group: config.ratify.dev
  scope: Cluster
  names:
    plural: verifiers
    singular: verifier
    kind: Verifier
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stores.config.ratify.dev
spec:
  group: config.ratify.dev
  scope: Cluster
  names:
    plural: stores
    singular: store
    kind: Store
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Service
metadata:
  name: ratify
  namespace: ratify-system
  labels:
    app.kubernetes.io/name: ratify
spec:
  selector:
    app.kubernetes.io/name: ratify
  ports:
  - port: 6000
    targetPort: 6000
    name: http
  - port: 6001
    targetPort: 6001
    name: crd
---
apiVersion: v1
kind: Namespace
metadata:
  name: ratify-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratify
  namespace: ratify-system
  labels:
    app.kubernetes.io/name: ratify
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratify
    spec:
      serviceAccountName: ratify
      containers:
      - name: ratify
        image: localhost:5001/ratify:v1.0.0
        command: ["/app/ratify"]
        args: ["serve", "--http", ":6000", "--enable-crd-controller"]
        ports:
        - containerPort: 6000
          name: http
        - containerPort: 6001
          name: crd
        env:
        - name: RATIFY_CONFIG
          value: /app/ratify
        readinessProbe:
          httpGet:
            path: /ready
            port: 6000
          initialDelaySeconds: 10
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /ready
            port: 6000
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /health
            port: 6000
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 256Mi}
