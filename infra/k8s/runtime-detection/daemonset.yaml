apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/name: falco
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: falco }
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: { app.kubernetes.io/name: falco }
      annotations:
        container.apparmor.security.beta.kubernetes.io/falco: unconfined
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
    spec:
      serviceAccountName: falco
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        securerag.dev/falco-enabled: "true" # Falco disabled in KIND due to eBPF limits
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: falco
          image: falcosecurity/falco:0.39.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8765
              protocol: TCP
          args:
            - /usr/bin/falco
            - -o
            - engine.kind=modern_ebpf
            - -o
            - watch_config_files=false
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_RESOURCE
                - SYS_PTRACE
                - BPF
                - PERFMON
          env:
            - name: HOST_ROOT
              value: /host
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          volumeMounts:
            - { name: rules, mountPath: /etc/falco/falco.yaml, subPath: falco.yaml }
            - { name: rules, mountPath: /etc/falco/securerag_rules.yaml, subPath: securerag_rules.yaml }
            - { name: rules, mountPath: /etc/falco/securerag_mitre_rules.yaml, subPath: securerag_mitre_rules.yaml }
            - { name: dev-fs, mountPath: /host/dev }
            - { name: proc-fs, mountPath: /host/proc, readOnly: true }
            - { name: boot-fs, mountPath: /host/boot, readOnly: true }
            - { name: lib-modules, mountPath: /host/lib/modules, readOnly: true }
            - { name: usr-fs, mountPath: /host/usr, readOnly: true }
            - { name: etc-fs, mountPath: /host/etc, readOnly: true }
            - { name: sys-fs, mountPath: /sys/kernel/debug, readOnly: true }
            - { name: tracing-fs, mountPath: /sys/kernel/tracing, readOnly: true }
            - { name: containerd-socket, mountPath: /run/containerd/containerd.sock, readOnly: true }
            - { name: falco-bpf-probe, mountPath: /root/.falco }
      volumes:
        - { name: rules, configMap: { name: falco-rules } }
        - { name: dev-fs, hostPath: { path: /dev } }
        - { name: proc-fs, hostPath: { path: /proc } }
        - { name: boot-fs, hostPath: { path: /boot } }
        - { name: lib-modules, hostPath: { path: /lib/modules } }
        - { name: usr-fs, hostPath: { path: /usr } }
        - { name: etc-fs, hostPath: { path: /etc } }
        - { name: sys-fs, hostPath: { path: /sys/kernel/debug } }
        - { name: tracing-fs, hostPath: { path: /sys/kernel/tracing } }
        - { name: containerd-socket, hostPath: { path: /run/containerd/containerd.sock } }
        - { name: falco-bpf-probe, emptyDir: {} }
