apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-rules
  namespace: falco
data:
  falco.yaml: |
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/k8s_audit_rules.yaml
      - /etc/falco/securerag_rules.yaml
      - /etc/falco/securerag_mitre_rules.yaml
    json_output: true
    json_include_output_property: true
    log_stderr: true
    log_syslog: false
    log_level: info
    priority: notice
    buffered_outputs: false
    syscall_event_drops:
      threshold: 0.1
      actions: [log, alert]
    metrics:
      enabled: true
      interval: 1h
      output_rule: true
    outputs:
      rate: 1
      max_burst: 1000
    stdout_output:
      enabled: true
    http_output:
      enabled: true
      url: "http://falcosidekick.falco.svc.cluster.local:2801"
      user_agent: "falcosecurity/falco"
      insecure: true
    grpc:
      enabled: false
    grpc_output:
      enabled: false
    container_engines:
      docker:
        enabled: false
      cri:
        enabled: true
        sockets: ["/run/containerd/containerd.sock"]
        disable_async: false
  securerag_rules.yaml: |
    # Custom Falco rules for SecureRAG Hub.
    - macro: securerag_namespace
      condition: (k8s.ns.name = "securerag-hub")

    - rule: SecureRAG Shell in Container
      desc: Detect interactive shell execution inside SecureRAG Hub pods.
      condition: >
        spawned_process and container and securerag_namespace and
        (proc.name in (bash, sh, zsh, dash, ksh))
      output: >
        Shell opened in SecureRAG Hub container
        (user=%user.name container=%container.name image=%container.image.repository
         pod=%k8s.pod.name proc=%proc.cmdline)
      priority: WARNING
      tags: [securerag, runtime, shell]

    - rule: SecureRAG Sensitive File Read
      desc: Detect read on /etc/shadow, secrets, or kubeconfig from SecureRAG pods.
      condition: >
        open_read and container and securerag_namespace and
        (fd.name in (/etc/shadow, /etc/passwd-, /etc/gshadow,
                     /var/run/secrets/kubernetes.io/serviceaccount/token,
                     /root/.kube/config))
      output: >
        Sensitive file read in SecureRAG container
        (file=%fd.name container=%container.name pod=%k8s.pod.name proc=%proc.name)
      priority: WARNING
      tags: [securerag, runtime, file-access]

    - rule: SecureRAG Outbound Unexpected Port
      desc: Detect outbound connections to non-standard ports.
      condition: >
        outbound and container and securerag_namespace and
        not fd.sport in (53, 80, 443, 5432, 6379, 9000, 9090, 3100, 9093)
      output: >
        Unexpected outbound connection from SecureRAG pod
        (dest=%fd.rip:%fd.rport pod=%k8s.pod.name proc=%proc.name)
      priority: NOTICE
      tags: [securerag, runtime, network]

    - rule: SecureRAG Privileged Process Spawn
      desc: Detect privilege escalation via setuid/setgid/setresuid.
      condition: >
        spawned_process and container and securerag_namespace and
        (proc.name in (sudo, su, doas))
      output: >
        Privileged process spawned in SecureRAG container
        (proc=%proc.name pod=%k8s.pod.name user=%user.name)
      priority: ERROR
      tags: [securerag, runtime, privilege]
  securerag_mitre_rules.yaml: |
    # SecureRAG Hub — MITRE ATT&CK aligned rules.
    # Canonical source: security/falco/custom-rules.yaml
    # Keep these two files in sync.
    - macro: securerag_ns
      condition: (k8s.ns.name = "securerag-hub")

    - macro: securerag_ctr
      condition: (container and securerag_ns)

    - macro: securerag_egress_ports
      condition: (fd.sport in (53, 80, 443, 5432, 6379, 8000, 9000, 9090, 3100, 9093))

    - macro: pkg_mgr_proc
      condition: >
        (proc.name in (apt, apt-get, dpkg, yum, rpm, dnf, microdnf, apk,
                       composer, npm, yarn, pnpm, pip, pip3, gem, go))

    - macro: shell_proc
      condition: (proc.name in (bash, sh, zsh, dash, ksh, ash, fish))

    # T1059 — reverse shell heuristic
    - rule: SecureRAG Reverse Shell Indicator
      desc: Process exec with TTY redirected to a network socket.
      condition: >
        spawned_process and securerag_ctr and shell_proc and
        (proc.cmdline contains "/dev/tcp/" or proc.cmdline contains "/dev/udp/" or
         proc.cmdline contains "bash -i" or proc.cmdline contains "nc -e" or
         proc.cmdline contains "ncat -e" or proc.cmdline contains "socat ")
      output: >
        Reverse shell pattern in SecureRAG pod
        (pod=%k8s.pod.name proc=%proc.cmdline parent=%proc.pname)
      priority: CRITICAL
      tags: [securerag, mitre_execution, T1059, reverse_shell]

    # T1136 — local account creation
    - rule: SecureRAG User Account Mutation
      desc: Attempt to create or modify local users in app pods.
      condition: >
        spawned_process and securerag_ctr and
        proc.name in (useradd, usermod, adduser, groupadd, passwd, chpasswd)
      output: >
        Local user mutation in SecureRAG pod
        (pod=%k8s.pod.name proc=%proc.cmdline)
      priority: CRITICAL
      tags: [securerag, mitre_persistence, T1136]

    # T1505 / T1136 — write below sensitive paths
    - rule: SecureRAG Write Below Sensitive Path
      desc: Writes outside expected app paths.
      condition: >
        evt.is_open_write=true and fd.typechar='f' and securerag_ctr and
        (fd.name startswith /etc/ or fd.name startswith /usr/ or
         (fd.name startswith /var/www/html/ and
          not fd.name startswith /var/www/html/storage/ and
          not fd.name startswith /var/www/html/bootstrap/cache/))
      output: >
        Write below sensitive path in SecureRAG pod
        (file=%fd.name proc=%proc.cmdline pod=%k8s.pod.name)
      priority: ERROR
      tags: [securerag, mitre_persistence, T1505, T1136]

    # T1543 — persistence via cron/systemd
    - rule: SecureRAG Persistence Mechanism Touched
      desc: Modification of cron/systemd/init artefacts inside container.
      condition: >
        evt.is_open_write=true and fd.typechar='f' and securerag_ctr and
        (fd.name startswith /etc/cron or fd.name startswith /var/spool/cron or
         fd.name startswith /etc/systemd/ or fd.name startswith /etc/init.d/)
      output: >
        Persistence artefact write in SecureRAG pod
        (file=%fd.name proc=%proc.cmdline pod=%k8s.pod.name)
      priority: ERROR
      tags: [securerag, mitre_persistence, T1543]

    # T1059 / T1105 — package manager exec at runtime
    - rule: SecureRAG Package Manager in Container
      desc: Package manager invoked inside a SecureRAG pod.
      condition: spawned_process and securerag_ctr and pkg_mgr_proc
      output: >
        Package manager invoked in SecureRAG pod
        (pod=%k8s.pod.name proc=%proc.cmdline parent=%proc.pname)
      priority: ERROR
      tags: [securerag, mitre_execution, T1059, T1105, supply_chain]

    # T1611 / T1548 — privilege escalation indicators
    - rule: SecureRAG Privilege Escalation Attempt
      desc: setuid binaries or privilege-raising processes spawned.
      condition: >
        spawned_process and securerag_ctr and
        proc.name in (sudo, su, doas, pkexec, chroot, mount, umount,
                      capsh, setpriv, runuser)
      output: >
        Privilege escalation attempt in SecureRAG pod
        (pod=%k8s.pod.name proc=%proc.cmdline user=%user.name)
      priority: CRITICAL
      tags: [securerag, mitre_privilege_escalation, T1611, T1548]

    # T1070 — log tampering
    - rule: SecureRAG Log Tampering
      desc: Truncation or deletion of log paths.
      condition: >
        ((evt.type in (unlink, unlinkat, rename, renameat)) or
         (evt.type=ftruncate and evt.dir=>)) and securerag_ctr and
        (fd.name startswith /var/log/ or
         fd.name startswith /var/www/html/storage/logs/ or
         fd.name startswith /tmp/securerag-runtime/storage/logs/)
      output: >
        Log artefact removal/truncation in SecureRAG pod
        (file=%fd.name proc=%proc.cmdline pod=%k8s.pod.name)
      priority: WARNING
      tags: [securerag, mitre_defense_evasion, T1070]

    # TA0011 — refined unexpected egress (replaces noisier broad rule).
    - rule: SecureRAG Outbound Unexpected Port (Refined)
      desc: Outbound from app pod outside the documented allow-list.
      condition: >
        outbound and securerag_ctr and not securerag_egress_ports and
        not fd.rip in (127.0.0.1, ::1)
      output: >
        Unexpected outbound connection from SecureRAG pod
        (dest=%fd.rip:%fd.rport proc=%proc.cmdline pod=%k8s.pod.name)
      priority: WARNING
      tags: [securerag, mitre_command_and_control, TA0011]

    # T1552.001 — broader credential file read
    - rule: SecureRAG Credential File Read
      desc: Read of .env, .pem, .key or cloud credential files.
      condition: >
        open_read and securerag_ctr and
        (fd.name endswith ".env" or fd.name endswith ".pem" or
         fd.name endswith ".key" or
         fd.name startswith /run/secrets/)
      output: >
        Credential file read in SecureRAG pod
        (file=%fd.name proc=%proc.cmdline pod=%k8s.pod.name)
      priority: ERROR
      tags: [securerag, mitre_credential_access, T1552]

    # T1610 / T1613 — suspicious K8s API audit events
    - rule: SecureRAG Suspicious K8s API Verb
      desc: SA in securerag-hub used for sensitive verbs.
      condition: >
        ka.verb in (create, delete, deletecollection, patch) and
        ka.target.namespace = "securerag-hub" and
        ka.target.resource in (pods/exec, pods/attach, secrets,
                               serviceaccounts, clusterrolebindings,
                               roles, rolebindings) and
        not ka.user.name in (system:apiserver,
                             system:kube-controller-manager,
                             system:kube-scheduler)
      output: >
        Suspicious K8s API verb in SecureRAG namespace
        (user=%ka.user.name verb=%ka.verb resource=%ka.target.resource
         name=%ka.target.name)
      priority: WARNING
      source: k8s_audit
      tags: [securerag, mitre_discovery, T1613, k8s_audit]
