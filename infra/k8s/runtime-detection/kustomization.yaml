apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap-rules.yaml
  - daemonset.yaml
  - falcosidekick.yaml      # P1-12 relais Falco -> Loki + Alertmanager
  - nats.yaml               # bus NATS requis par falco-talon
labels:
  - pairs:
      app.kubernetes.io/part-of: securerag-hub
      app.kubernetes.io/component: runtime-detection
