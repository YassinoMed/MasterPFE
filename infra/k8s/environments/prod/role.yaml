# SecureRAG — RBAC spécifique prod (securerag-prod)
# Rôle en lecture seule intra-namespace, lié au ServiceAccount securerag-sa.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securerag-prod-readonly
  namespace: securerag-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securerag-prod-readonly-binding
  namespace: securerag-prod
subjects:
  - kind: ServiceAccount
    name: securerag-sa
    namespace: securerag-prod
roleRef:
  kind: Role
  name: securerag-prod-readonly
  apiGroup: rbac.authorization.k8s.io
