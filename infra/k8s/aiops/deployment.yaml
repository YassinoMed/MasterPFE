# AIOps — Ollama + OpenWebUI + LangGraph
# Namespace: aiops-system
# Feature flag: ENABLE_AIOPS=false
# Complète Prometheus + Loki + Grafana — ne les remplace PAS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: ollama
    feature.securerag.dev/enable-aiops: "false"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.1.30@sha256:90121234567ddc563e414c243003006d6490edaf828ea28a0e98032ec1a1abec
          ports: [{ containerPort: 11434 }]
          resources:
            requests: { cpu: 1, memory: 4Gi }
            limits: { cpu: 4, memory: 8Gi }
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: { sizeLimit: 20Gi }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: openwebui
    feature.securerag.dev/enable-aiops: "false"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: openwebui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openwebui }
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main
          ports: [{ containerPort: 8080 }]
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.aiops-system.svc:11434"
            - name: ENABLE_AIOPS
              value: "false"
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2, memory: 4Gi }

---
# AIOps Analysis Job — Analyse logs Loki + prédiction incidents
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-log-analyzer
  namespace: aiops-system
spec:
  schedule: "*/15 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: analyzer
              image: python:3.12-alpine
              command:
                - python3
                - -c
                - |
                  import json, urllib.request
                  try:
                      r = urllib.request.urlopen("http://loki.securerag-monitoring.svc:3100/loki/api/v1/query_range?query={namespace=\"securerag-hub\"}[1h]&limit=100")
                      print("AIOps: logs retrieved for analysis")
                  except Exception as e:
                      print(f"AIOps: analysis skipped — {e}")
