# OpenCost — Kubernetes Cost Monitoring
# Déploie OpenCost pour le suivi des coûts par namespace, deployment, et service.
# Intégré avec Prometheus pour le scraping des métriques de coût.
#
# Validation:
#   kubectl apply --dry-run=server -k infra/k8s/finops/
#   kubectl port-forward -n finops service/opencost 9090:9090
#   opencost --address http://localhost:9090/api/cost/allocation
#
# Rollback:
#   kubectl delete namespace finops

---
apiVersion: v1
kind: Namespace
metadata:
  name: finops
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: finops
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: finops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-config
  namespace: finops
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
data:
  opencost.yaml: |
    kubecost_model:
      default_idle: false
      custom_price:
        enabled: false
    prometheus:
      internal: false
      query_offset: 5m
      bearer_token: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: finops
  labels:
    app: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencost
  template:
    metadata:
      labels:
        app: opencost
        app.kubernetes.io/part-of: securerag-hub
        app.kubernetes.io/component: finops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9003"
    spec:
      serviceAccountName: opencost
      containers:
        - name: opencost
          image: quay.io/kubecost1/opencost:latest
          ports:
            - name: api
              containerPort: 9003
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
            - name: CLUSTER_ID
              value: "securerag-hub"
            - name: CLOUD_PROVIDER_API_KEY
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/opencost
      volumes:
        - name: config
          configMap:
            name: opencost-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: finops
  labels:
    app: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
spec:
  selector:
    app: opencost
  ports:
    - name: api
      port: 9003
      targetPort: 9003
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opencost
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: opencost
  namespaceSelector:
    matchNames:
      - finops
  endpoints:
    - port: api
      interval: 30s
      path: /metrics
