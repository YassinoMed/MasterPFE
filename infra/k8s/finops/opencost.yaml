apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: securerag-finops
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "resourcequotas", "replicationcontrollers", "limitranges", "persistentvolumes", "persistentvolumeclaims", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: securerag-finops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: securerag-finops
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencost
        app.kubernetes.io/part-of: securerag-hub
        app.kubernetes.io/component: finops
    spec:
      serviceAccountName: opencost
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencost
          image: ghcr.io/opencost/opencost:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 9003
              protocol: TCP
            - name: ui
              containerPort: 9004
              protocol: TCP
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: http://prometheus.securerag-monitoring.svc:9090
            - name: OPENCOST_PROMETHEUS_QUERY_URL
              value: http://prometheus.securerag-monitoring.svc:9090
            - name: EMIT_NAMESPACE_METRICS
              value: "true"
            - name: EMIT_DEPLOYMENT_METRICS
              value: "true"
            - name: EMIT_POD_METRICS
              value: "true"
            - name: EMIT_NODE_METRICS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 5
            periodSeconds: 15
