# OpenTelemetry Collector + Tempo (Tracing)
# Namespace: otel-system
# Feature flag: ENABLE_OPENTELEMETRY=false
# Ajoute le tracing distribué SANS remplacer Prometheus/Grafana/Loki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-system
  labels:
    app.kubernetes.io/name: otel-collector
    feature.securerag.dev/enable-opentelemetry: "false"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 8888, name: metrics }
          args:
            - --config=/etc/otel/config.yaml
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
      volumes:
        - { name: config, configMap: { name: otel-config } }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: otel-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
          http: { endpoint: "0.0.0.0:4318" }
    exporters:
      otlphttp/tempo:
        endpoint: "http://tempo.otel-system.svc:4318"
        tls: { insecure: true }
      prometheus:
        endpoint: "0.0.0.0:8888"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlphttp/tempo]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: otel-system
  labels:
    app.kubernetes.io/name: tempo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tempo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:latest
          ports:
            - { containerPort: 3200, name: http }
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          args:
            - -config.file=/etc/tempo/config.yaml
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
      volumes:
        - { name: config, configMap: { name: tempo-config } }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: otel-system
data:
  config.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp: { protocols: { grpc: {}, http: {} } }
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/traces
    querier:
      frontend_worker:
        frontend_address: "tempo.otel-system.svc:9095"
