# EndpointSlice statique vers le conteneur Docker `kind-registry` (réseau `kind`).
# Si le conteneur est recréé et change d'IP : `docker inspect kind-registry`
# puis mettre à jour l'adresse ci-dessous (et recommitter).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kind-registry
  namespace: registry
  labels:
    kubernetes.io/service-name: kind-registry
    app.kubernetes.io/part-of: securerag-platform
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5000
endpoints:
  - addresses:
      - 172.18.0.5
    conditions:
      ready: true
