apiVersion: v1
kind: Service
metadata:
  name: kind-registry
  namespace: registry
  labels:
    app.kubernetes.io/part-of: securerag-platform
spec:
  # Service sans selector : endpoints statiques (endpointslice.yaml).
  # Le port service est 5001 (nom symbolique du registry local :5001),
  # mappé vers le port réel 5000 du conteneur via le nom de port "http".
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: http
