# Chaos Engineering — LitmusChaos Workflow Experiments
# Tests resilience of SecureRAG Hub components.
---
# Experiment 1: Pod Failure
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: securerag-pod-failure
  namespace: securerag-hub
  labels:
    app.kubernetes.io/part-of: securerag-hub
    chaos.securerag.dev/type: pod-failure
spec:
  engineState: active
  appinfo:
    appns: securerag-hub
    applabel: app.kubernetes.io/part-of=securerag-hub
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"

---
# Experiment 2: Node Failure (drain simulation)
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: securerag-node-drain
  namespace: securerag-hub
  labels:
    chaos.securerag.dev/type: node-failure
spec:
  engineState: active
  appinfo:
    appns: securerag-hub
    applabel: app.kubernetes.io/part-of=securerag-hub
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: node-drain
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: APP_NODE
              value: ""

---
# Experiment 3: Network Loss
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: securerag-network-loss
  namespace: securerag-hub
  labels:
    chaos.securerag.dev/type: network-failure
spec:
  engineState: active
  appinfo:
    appns: securerag-hub
    applabel: app.kubernetes.io/name=portal-web
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: NETWORK_INTERFACE
              value: "eth0"
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: CONTAINER_RUNTIME
              value: "containerd"

