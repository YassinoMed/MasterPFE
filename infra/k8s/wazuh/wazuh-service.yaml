apiVersion: v1
kind: Namespace
metadata:
  name: wazuh
  labels:
    app.kubernetes.io/name: wazuh
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh-manager
spec:
  # Use ExternalName if Wazuh is deployed via docker-compose outside the cluster
  # OR ClusterIP if deployed inside. For the demo/recette with docker-compose:
  type: ExternalName
  externalName: host.docker.internal # Resolves to the docker host where docker-compose runs
  ports:
    - name: syslog
      port: 514
      protocol: UDP
    - name: agent
      port: 1514
      protocol: TCP
    - name: api
      port: 55000
      protocol: TCP
