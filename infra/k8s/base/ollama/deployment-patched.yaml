# Ollama — LLM Runtime local (MLSecOps Phase: AI Runtime)
# Conforme aux 8 policies Kyverno Enforce :
#   - runAsNonRoot + capabilities drop + seccomp (disallow-root, workload-controls)
#   - automountServiceAccountToken: false (workload-controls)
#   - probes readiness/liveness/startup (workload-controls)
#   - image digest-pinned + cosign signée (restrict-image-references, verify-cosign)
#   - mémoire <= 2Gi (LimitRange namespace)
#   - Service ClusterIP allowlisté (restrict-service-exposure)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: securerag-hub
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/component: llm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: securerag-hub
        app.kubernetes.io/component: llm-runtime
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11434"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: kind-registry.registry.svc.cluster.local:5001/ollama@sha256:4be1eaabf0dd0152bfbb780347e2888b5fe86ec25d0faa3eb4b1a956173736fb
        env:
        - name: OLLAMA_MODELS
          value: /ollama/models
        - name: OLLAMA_CONTEXT_LENGTH
          value: "1024"
        - name: OLLAMA_HOME
          value: /ollama
        ports:
        - containerPort: 11434
          name: api
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/tags
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/tags
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/tags
            port: api
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: ollama-home
          mountPath: /ollama
      volumes:
      - name: ollama-home
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: securerag-hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama
  ports:
  - port: 11434
    targetPort: api
    name: api
