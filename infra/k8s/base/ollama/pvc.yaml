# PVC pour les modèles Ollama — survit aux restarts de pod
# (kind provisionne automatiquement via local-path-provisioner)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: securerag-hub
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: securerag-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
