apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-web-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Portail public (NodePort 30081) : trafic entrant autorisé depuis tout
        # le cluster et les IP externes via kube-proxy (rôle frontend assumé).
        - podSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-users
                  - chatbot-manager
                  - conversation-service
                  - audit-security-service
      ports:
        - protocol: TCP
          port: 8000
