# Resource quotas + limit ranges per environment
# Isolation of consumables
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-securerag-dev
  namespace: securerag-dev
spec:
  hard:
    cpu.requests: "2"
    memory.requests: "2Gi"
    cpu.limits: "4"
    memory.limits: "4Gi"
    pods: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits-securerag-dev
  namespace: securerag-dev
spec:
  limits:
  - default:
      cpu: "100m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    type: Container
---
