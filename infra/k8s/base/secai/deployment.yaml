apiVersion: apps/v1
kind: Deployment
metadata:
  name: secai
  namespace: securerag-hub
  labels: {app.kubernetes.io/part-of: securerag-hub}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: secai}
  template:
    metadata:
      labels: {app.kubernetes.io/name: secai}
      annotations:
        # URL HTTP interne (gateway LLM) : trafic cluster-only, restreint
        # par secai-egress-ai-stack NetworkPolicy (exigence Kyverno).
        security.securerag.dev/internal-cleartext-scope: cluster-only-networkpolicy
    spec:
      serviceAccountName: secai-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: model-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory}
      containers:
        - name: secai
          image: localhost:5001/secai@sha256:107a7bc28ab856bae0cc5ba2871e83b5c4faf19fdc4c6b6b47cccbb04ceb1d6d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SECAI_MODEL_ID
              valueFrom:
                configMapKeyRef: {name: secai-config, key: model_id}
            - name: SECAI_DEVICE
              valueFrom:
                configMapKeyRef: {name: secai-config, key: device}
            - name: SECAI_MAX_LENGTH
              valueFrom:
                configMapKeyRef: {name: secai-config, key: max_length}
            - name: SECAI_CONFIDENCE_THRESHOLD
              valueFrom:
                configMapKeyRef: {name: secai-config, key: confidence_threshold}
            - name: SECAI_MODE
              valueFrom:
                configMapKeyRef: {name: secai-config, key: mode}
            - name: SECAI_ENABLE_EXTERNAL_LLM
              valueFrom:
                configMapKeyRef: {name: secai-config, key: enable_external_llm}
            - name: SECAI_AUTO_REMEDIATION
              valueFrom:
                configMapKeyRef: {name: secai-config, key: auto_remediation}
            # ── Chemin LLM production (/llm/analyze) : guardrails + gateway ──
            - name: SECAI_LLM_GATEWAY_URL
              value: "http://ai-gateway-litellm.securerag-hub.svc.cluster.local:4000/v1/chat/completions"
            - name: SECAI_LLM_MODEL
              value: "securerag-llm"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm-master-key, key: master-key}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: "2Gi"}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /app/model-cache
          startupProbe:
            httpGet: {path: /ready, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /ready, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
