apiVersion: v1
data:
  auto_remediation: 'false'
  confidence_threshold: '0.80'
  device: auto
  enable_external_llm: 'false'
  max_length: '1024'
  mode: advisory
  model_id: cisco-ai/SecureBERT2.0-base
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: securerag-hub
  name: secai-config
  namespace: securerag-hub
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secai-netpol
  namespace: securerag-hub
spec:
  egress:
  - ports:
    - port: 8001
    to:
    - podSelector: {}
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 8001
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secai
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: Service
metadata:
  name: secai
  namespace: securerag-hub
  labels: {app.kubernetes.io/part-of: securerag-hub}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secai
  ports:
    - port: 8001
      targetPort: 8001
