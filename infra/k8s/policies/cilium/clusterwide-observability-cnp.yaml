apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "allow-observability-traffic"
spec:
  description: "Allow monitoring traffic across the cluster (Prometheus, OTel, DNS)"
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: Exists
  ingress:
    # Allow Prometheus to scrape metrics from any pod
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "securerag-monitoring"
            "k8s:app.kubernetes.io/name": "prometheus"
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9000"
              protocol: TCP
  egress:
    # Allow exporting traces to OpenTelemetry Collector
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "otel-system"
            "k8s:app.kubernetes.io/name": "otel-collector"
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "kube-system"
            "k8s:k8s-app": "kube-dns"
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
