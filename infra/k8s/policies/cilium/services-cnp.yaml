apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "api-gateway-cnp"
  namespace: "securerag-hub"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  ingress:
    # Allow external ingress (if using Nginx or other Ingress controller, we allow from everywhere or specific LB)
    - fromEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: ".*"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: auth-users
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: ".*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: chatbot-manager
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: ".*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: llm-orchestrator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: ".*"
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "portal-web-cnp"
  namespace: "securerag-hub"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: portal-web
  ingress:
    - fromEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: ".*"
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - auth-users
                - chatbot-manager
                - conversation-service
                - audit-security-service
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: ".*"
---
apiVersion: "cilium.io/v2"
