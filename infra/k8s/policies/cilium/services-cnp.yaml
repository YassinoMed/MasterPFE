apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "api-gateway-cnp"
  namespace: "securerag-hub"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  ingress:
    - fromEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/api/.*"
              - method: "POST"
                path: "/api/.*"
              - method: "GET"
                path: "/health"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: auth-users
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/api/auth/.*"
              - method: "POST"
                path: "/api/login"
              - method: "POST"
                path: "/api/register"
              - method: "POST"
                path: "/api/logout"
              - method: "GET"
                path: "/health"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: chatbot-manager
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/api/chatbots.*"
              - method: "POST"
                path: "/api/chatbots.*"
              - method: "GET"
                path: "/health"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: llm-orchestrator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "POST"
                path: "/api/v1/.*"
              - method: "GET"
                path: "/health"
    # Allow DNS resolution
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
