apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "auth-users-cnp"
  namespace: "securerag-hub"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: auth-users
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - portal-web
                - chatbot-manager
                - api-gateway
                - llm-orchestrator
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/api/auth/.*"
              - method: "POST"
                path: "/api/login"
              - method: "POST"
                path: "/api/register"
              - method: "POST"
                path: "/api/logout"
              - method: "GET"
                path: "/api/users.*"
              - method: "GET"
                path: "/health"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgres-auth
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
