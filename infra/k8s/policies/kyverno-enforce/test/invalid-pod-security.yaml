apiVersion: v1
kind: Pod
metadata:
  name: invalid-pod-security
  namespace: securerag-hub
spec:
  automountServiceAccountToken: true
  serviceAccountName: default
  securityContext:
    runAsNonRoot: false
  containers:
    - name: app
      image: localhost:5001/securerag-hub-app:v1
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: 200m
          memory: 256Mi
          ephemeral-storage: 2Gi
