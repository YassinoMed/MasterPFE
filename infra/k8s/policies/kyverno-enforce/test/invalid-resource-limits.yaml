apiVersion: v1
kind: Pod
metadata:
  name: invalid-resource-limits
  namespace: securerag-hub
spec:
  automountServiceAccountToken: false
  serviceAccountName: custom-sa
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: localhost:5001/securerag-hub-app:v1
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # Missing resources.requests and resources.limits
