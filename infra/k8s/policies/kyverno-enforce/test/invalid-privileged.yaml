apiVersion: v1
kind: Pod
metadata:
  name: invalid-privileged
  namespace: securerag-hub
spec:
  automountServiceAccountToken: false
  serviceAccountName: custom-sa
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: localhost:5001/securerag-hub-app:v1
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: 200m
          memory: 256Mi
          ephemeral-storage: 2Gi
