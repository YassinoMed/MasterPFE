# ClusterPolicy: Verify SBOM Attestation
# Ensures every container image has a valid CycloneDX SBOM attached.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-sbom-attestation
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Verify SBOM Attestation
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image in securerag-hub must have a valid SBOM (Software
      Bill of Materials) attestation attached. This ensures full visibility
      into the software supply chain and enables vulnerability tracking.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-sbom
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
      verifyImages:
        - imageReferences:
            - "localhost:5001/securerag-hub-*"
            - "harbor.securerag.local/securerag-hub/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/YassinoMed/MasterPFE/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
          attestations:
            - predicateType: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/YassinoMed/MasterPFE/.github/workflows/*"
                        issuer: "https://token.actions.githubusercontent.com"
            - predicateType: https://cyclonedx.org/bom
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/YassinoMed/MasterPFE/.github/workflows/*"
                        issuer: "https://token.actions.githubusercontent.com"
