apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-verify-cosign-images
  annotations:
    policies.kyverno.io/title: Verify Image Signature Key Static
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies OCI image signatures using static public key validation.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-image-signature-key
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - securerag-dev
                - securerag-test
                - securerag-staging
                - securerag-preprod
                - securerag-prod
      verifyImages:
        - imageReferences:
            - "registry.securerag.local/*"
            - "localhost:5001/securerag-hub-*"
            - "kind-registry.registry.svc.cluster.local:5001/securerag-hub-*"
          required: true
          mutateDigest: true
          verifyDigest: true
          # Registry local Kind en HTTP clair (maillage via Service registry/kind-registry).
          imageRegistryCredentials:
            allowInsecureRegistry: true
          attestors:
            - count: 1
              entries:
                - keys:
                    # Signatures hors-ligne (pas de rekor sur un cluster Kind isolé) :
                    # on demande à Kyverno de ne pas interroger le transparency log.
                    rekor:
                      ignoreTlog: true
                    publicKeys: |
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEnbWQ/uK/K9dbV2c79kPbRrj31kcQ
                      nPRQKxX2P86qL9nPfcSJnngSMlz7SSqW7IuV5/hTgdMxmaVHrm5d4zhvtg==
                      -----END PUBLIC KEY-----
