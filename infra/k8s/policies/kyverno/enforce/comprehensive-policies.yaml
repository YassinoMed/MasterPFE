# ClusterPolicy: Require Read-Only Root Filesystem
# Enforces readOnlyRootFilesystem on all containers.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-rootfs
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must use a read-only root filesystem to prevent
      runtime modifications. Writable directories must be explicitly
      mounted as emptyDir volumes.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
      validate:
        message: "All containers must set securityContext.readOnlyRootFilesystem to true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true

---
# ClusterPolicy: Require Resource Limits
# Enforces CPU and memory limits on all containers.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must have CPU and memory requests and limits defined.
      This prevents resource starvation and enables proper scheduling.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
      validate:
        message: "All containers must define resources.requests and resources.limits for CPU and memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"

---
# ClusterPolicy: Require Mandatory Labels
# Enforces standard Kubernetes recommended labels.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Require Mandatory Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Deployment, StatefulSet
    policies.kyverno.io/description: >-
      All workloads must include standard Kubernetes recommended labels
      for identification, versioning, and ownership tracking.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-labels-deployments
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              namespaces:
                - securerag-hub
      validate:
        message: >-
          Workloads must include labels: app.kubernetes.io/name,
          app.kubernetes.io/version, app.kubernetes.io/part-of,
          app.kubernetes.io/managed-by
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/part-of: "?*"
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "?*"

