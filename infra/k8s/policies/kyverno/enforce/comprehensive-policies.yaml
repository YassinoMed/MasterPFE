---
# ClusterPolicy: Require NetworkPolicy per Namespace
# Ensures every namespace with workloads has a default-deny NetworkPolicy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-networkpolicy
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Generate Default-Deny NetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Automatically generates a default-deny NetworkPolicy for every
      new namespace to enforce Zero Trust network segmentation.
spec:
  validationFailureAction: Enforce
  rules:
    - name: generate-default-deny
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
      generate:
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress

---
# ClusterPolicy: Enforce Pod Security Standards
# Comprehensive pod security enforcement combining all critical controls.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-pod-security
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Enforce Pod Security Standards (Restricted)
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforces the Kubernetes Pod Security Standards at the Restricted
      profile level. All containers must run as non-root, drop all
      capabilities, and disable privilege escalation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-pod-security
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
      validate:
        message: >-
          Pod violates restricted security profile: runAsNonRoot=true,
          allowPrivilegeEscalation=false, drop ALL capabilities required.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL

---
# ClusterPolicy: Restrict Ingress without TLS
# Block Ingress resources that don't have TLS configured.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-ingress-no-tls
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/title: Restrict Ingress Without TLS
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      All Ingress resources must have TLS configured. Plaintext HTTP
      endpoints are forbidden in production namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-tls
      match:
        any:
          - resources:
              kinds:
                - Ingress
              namespaces:
                - securerag-hub
      validate:
        message: "Ingress resources must have TLS configured. Plaintext HTTP is forbidden."
        pattern:
          spec:
            tls:
              - hosts:
                  - "?*"
                secretName: "?*"
