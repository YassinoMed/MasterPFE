apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-audit-cleartext-env-values
  annotations:
    policies.kyverno.io/title: Audit clear-text environment URLs
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Audits Pods that expose literal clear-text HTTP
      URLs through environment variables without an explicit SecureRAG internal-cleartext
      risk acceptance annotation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: audit-literal-http-env-without-risk-acceptance
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - securerag-hub
          - securerag-dev
          - securerag-test
          - securerag-staging
          - securerag-preprod
          - securerag-prod
          operations:
          - CREATE
          - UPDATE
    validate:
      message: Literal clear-text HTTP environment URLs require the annotation security.securerag.dev/internal-cleartext-scope=cluster-only-networkpolicy.
        Prefer an internal service scheme variable for cluster-only traffic and HTTPS
        for public exposure.
      cel:
        expressions:
        - expression: "(\n  has(object.metadata.annotations) &&\n  'security.securerag.dev/internal-cleartext-scope'\
            \ in object.metadata.annotations &&\n  object.metadata.annotations['security.securerag.dev/internal-cleartext-scope']\
            \ == 'cluster-only-networkpolicy'\n) || (\n  !object.spec.containers.exists(container,\n\
            \    has(container.env) &&\n    container.env.exists(env, has(env.value)\
            \ && env.value.startsWith('http://'))\n  ) &&\n  (\n    !has(object.spec.initContainers)\
            \ ||\n    !object.spec.initContainers.exists(container,\n      has(container.env)\
            \ &&\n      container.env.exists(env, has(env.value) && env.value.startsWith('http://'))\n\
            \    )\n  )\n)"
          message: Literal clear-text HTTP environment URLs require the annotation
            security.securerag.dev/internal-cleartext-scope=cluster-only-networkpolicy.
    skipBackgroundRequests: true
  admission: true
  emitWarning: false
