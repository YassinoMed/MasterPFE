apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-restrict-image-references
  labels:
    app.kubernetes.io/part-of: securerag-hub
    app.kubernetes.io/managed-by: kyverno
  annotations:
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Restrict SecureRAG image references
    policies.kyverno.io/description: >-
      Audits Pods that use mutable latest tags or images outside the trusted
      registries required by the official SecureRAG Laravel runtime.
      Validation Pods are limited to the pinned curlimages/curl helper image family.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tags
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - securerag-dev
                - securerag-test
                - securerag-staging
                - securerag-preprod
                - securerag-prod
      validate:
        message: >-
          Mutable latest tags are not accepted for SecureRAG runtime Pods.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"

    - name: restrict-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - securerag-dev
                - securerag-test
                - securerag-staging
                - securerag-preprod
                - securerag-prod
              selector:
                matchExpressions:
                  - key: job-role
                    operator: DoesNotExist
      validate:
        message: >-
          Runtime images must come from localhost:5001,
          kind-registry.registry.svc.cluster.local:5001 or ghcr.io.
        pattern:
          spec:
            containers:
              - image: "localhost:5001/* | kind-registry.registry.svc.cluster.local:5001/* | ghcr.io/*"
            =(initContainers):
              - image: "localhost:5001/* | kind-registry.registry.svc.cluster.local:5001/* | ghcr.io/*"

    - name: restrict-validation-helper-image
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - securerag-dev
                - securerag-test
                - securerag-staging
                - securerag-preprod
                - securerag-prod
              selector:
                matchLabels:
                  job-role: validation
      validate:
        message: >-
          Validation Pods may only use the pinned curlimages/curl and
          grafana/k6 helper families.
        pattern:
          spec:
            containers:
              - image: "curlimages/curl:* | grafana/k6:*"
            =(initContainers):
              - image: "curlimages/curl:* | grafana/k6:*"

    - name: require-immutable-image-digests
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - securerag-dev
                - securerag-test
                - securerag-staging
                - securerag-preprod
                - securerag-prod
              selector:
                matchExpressions:
                  - key: job-role
                    operator: DoesNotExist
      validate:
        message: >-
          All containers in SecureRAG namespaces must use immutable digest
          references (@sha256:...). No floating tag is ever admitted.
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
            =(initContainers):
              - image: "*@sha256:*"
