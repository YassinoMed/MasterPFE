# values-override.yaml for Falco — SOC2 runtime security
# Integrates: Falco → Falcosidekick → Falco Talon + Wazuh SIEM

falco:
  http_output:
    enabled: true
    url: "http://falco-talon.falco.svc:2803"
    format: "json"

  # JSON output for webhooks and SIEM integration
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

  # Enable Kubernetes audit log consumption
  webserver:
    enabled: true
    listen_port: 8765
    k8s_audit_endpoint: /k8s-audit

# Falcosidekick outputs — forward to Wazuh SIEM + Loki
falcosidekick:
  enabled: true
  config:
    # Forward to Wazuh API for SOC2 SIEM correlation
    webhook:
      address: "http://wazuh-manager.wazuh.svc:55000/active-response"
      method: "POST"
      customHeaders:
        Content-Type: "application/json"
    # Forward to Loki for Grafana dashboards
    loki:
      hostPort: "http://loki.securerag-monitoring.svc:3100"
      tenant: "falco"
    # Slack notifications for critical alerts
    slack:
      webhookurl: ""  # Injected via ExternalSecret from Vault
      minimumpriority: "warning"

# Enable metrics for SOC2 observability
metrics:
  enabled: true

# Kubernetes audit log rules
customRules:
  k8s-audit-rules.yaml: |-
    - rule: K8s Privileged Pod Created
      desc: Detect creation of privileged pods
      condition: >
        ka.verb = "create" and
        ka.target.resource = "pods" and
        jevt.value[/requestObject/spec/containers/0/securityContext/privileged] = "true"
      output: >
        Privileged pod created (user=%ka.user.name pod=%ka.target.name
        ns=%ka.target.namespace)
      priority: CRITICAL
      tags: [k8s_audit, privileged, soc2]

    - rule: K8s Secret Accessed
      desc: Detect access to Kubernetes secrets
      condition: >
        ka.verb in ("get", "list") and
        ka.target.resource = "secrets" and
        not ka.user.name in ("system:serviceaccount:external-secrets:external-secrets",
                             "system:serviceaccount:vault:vault")
      output: >
        Secret accessed (user=%ka.user.name secret=%ka.target.name
        ns=%ka.target.namespace verb=%ka.verb)
      priority: WARNING
      tags: [k8s_audit, secrets, soc2]
