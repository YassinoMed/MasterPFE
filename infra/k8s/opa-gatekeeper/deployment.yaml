# OPA Gatekeeper — Policy as Code (active)
# Namespace: gatekeeper-system
# Feature flag: ENABLE_GATEKEEPER=true
# Complémentaire à Kyverno — Rego-based policies pour admission control
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatekeeper-controller-manager
  namespace: gatekeeper-system
  labels:
    app.kubernetes.io/name: gatekeeper
    feature.securerag.dev/enable-gatekeeper: "true"
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: gatekeeper }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gatekeeper }
    spec:
      serviceAccountName: gatekeeper-admin
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: gatekeeper }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: manager
          image: openpolicyagent/gatekeeper:v3.18.0
          args:
            - --port=8443
            - --health-addr=:9090
            - --logtostderr
            - --enable-merge-ingress-status=false
          ports:
            - { containerPort: 8443, name: webhook }
            - { containerPort: 9090, name: health }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /v1/readyz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/healthz, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gatekeeper-webhook-service
  namespace: gatekeeper-system
  labels:
    app.kubernetes.io/name: gatekeeper
    feature.securerag.dev/enable-gatekeeper: "true"
spec:
  ports:
    - port: 443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: gatekeeper
---
apiVersion: v1
kind: Namespace
metadata:
  name: gatekeeper-system
  labels:
    app.kubernetes.io/part-of: securerag-hub
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatekeeper-manager-role
  labels:
    app.kubernetes.io/name: gatekeeper
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-gatekeeper: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatekeeper-manager-rolebinding
  labels:
    app.kubernetes.io/name: gatekeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatekeeper-manager-role
subjects:
  - kind: ServiceAccount
    name: gatekeeper-admin
    namespace: gatekeeper-system
