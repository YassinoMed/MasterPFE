# Gatekeeper ConstraintTemplate — Disallow Privileged Containers
# Exceptions: Falco, Cilium, Tetragon, Wazuh runtime components
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowprivileged
  annotations:
    feature.securerag.dev/enable-gatekeeper: "true"
    metadata.gatekeeper.sh/title: "Disallow Privileged Containers"
    metadata.gatekeeper.sh/version: 1.0.0
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowPrivileged
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowprivileged
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged
          not exempt_namespace(input.review.object.metadata.namespace)
          msg := sprintf("privileged container <%v> is not allowed in namespace <%v>", [container.name, input.review.object.metadata.namespace])
        }
        exempt_namespace(ns) {
          exempt_ns := input.parameters.exemptNamespaces[_]
          ns == exempt_ns
        }
