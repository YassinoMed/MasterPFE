# Gatekeeper ConstraintTemplate — Disallow hostPath volumes
# Exceptions: Falco, Cilium, Tetragon, Wazuh, SPIFFE runtime components
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowhostpath
  annotations:
    feature.securerag.dev/enable-gatekeeper: "true"
    metadata.gatekeeper.sh/title: "Disallow hostPath Volumes"
    metadata.gatekeeper.sh/version: 1.0.0
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowHostPath
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowhostpath
        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          not exempt_namespace(input.review.object.metadata.namespace)
          msg := sprintf("hostPath volume <%v> is not allowed in namespace <%v>", [volume.name, input.review.object.metadata.namespace])
        }
        exempt_namespace(ns) {
          exempt_ns := input.parameters.exemptNamespaces[_]
          ns == exempt_ns
        }
