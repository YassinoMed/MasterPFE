apiVersion: v1
kind: ResourceQuota
metadata:
  name: securerag-hub-quota
spec:
  hard:
    pods: "30"
    services: "20"
    persistentvolumeclaims: "10"
    requests.cpu: "6"
    limits.cpu: "12"
    requests.memory: 6Gi
    limits.memory: 12Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 12Gi
    requests.storage: 40Gi
