# Token d'administration du portail — demo staging (valeur factice autorisée (valeur factice autorisée,
# cf. overlays/SECRETS.md). Sourcé depuis Vault via ESO, jamais en clair dans git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: portal-admin-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: portal-admin-token
  data:
    - secretKey: token
      remoteRef:
        key: securerag/portal-web
        property: token
