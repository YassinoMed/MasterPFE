# Template SOPS — à chiffrer avec age avant de commiter.
# Commande (démo) :
#   sops --encrypt --age <recipient> --in-place infra/k8s/overlays/demo/portal-admin-secret.sops.yaml
# et ajouter au .gitignore : *secret.sops* (ou commiter la version chiffrée)
# Décryptage portail admin (démo) :
#   SOPS_AGE_KEY_FILE=... sops --decrypt portal-admin-secret.sops.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: portal-admin-token
  namespace: securerag-hub
  labels:
    app.kubernetes.io/part-of: securerag-hub
type: Opaque
stringData:
  token: <SET_ME_WITH_SOPS>
