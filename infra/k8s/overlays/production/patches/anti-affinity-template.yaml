# Anti-affinity + Topology spread constraints — Production overlay
# Élimine les SPOFs en distribuant les pods entre nœuds/zones.
#
# Usage : ajouter ces patches dans infra/k8s/overlays/production/kustomization.yaml

# ── Anti-affinity : empêche 2 pods du même service sur le même nœud
- op: add
  path: /spec/template/spec/affinity
  value:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - portal-web
            topologyKey: kubernetes.io/hostname

# ── Topology spread : distribue uniformément entre zones
- op: add
  path: /spec/template/spec/topologySpreadConstraints
  value:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: portal-web
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: portal-web
