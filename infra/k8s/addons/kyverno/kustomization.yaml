apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kyverno installation for the local demonstration cluster.
# Source pinned to a tagged release for reproducibility.

resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.16.2/install.yaml

patches:
  - target:
      kind: ClusterRole
      name: kyverno:admission-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: securerag-kyverno
  - target:
      kind: ClusterRole
      name: kyverno:background-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: securerag-kyverno
  - target:
      kind: ClusterRole
      name: kyverno:cleanup-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: securerag-kyverno
  - target:
      kind: ClusterRole
      name: kyverno:reports-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: securerag-kyverno
