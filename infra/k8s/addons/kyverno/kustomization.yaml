apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kyverno installation for the local demonstration cluster.
# Source pinned to a tagged release for reproducibility.

resources:
  # v1.16.2 downgrade involontaire (cassait le boot de l'admission controller :
  # "x509: failed to parse private key" sur la paire TLS générée par v1.19.x).
  # Repin à la version saine éprouvée sur ce cluster.
  - https://github.com/kyverno/kyverno/releases/download/v1.19.1/install.yaml

patches:
  - target:
      kind: ClusterRole
      name: kyverno:admission-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: kyverno
  - target:
      kind: ClusterRole
      name: kyverno:background-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: kyverno
  - target:
      kind: ClusterRole
      name: kyverno:cleanup-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: kyverno
  - target:
      kind: ClusterRole
      name: kyverno:reports-controller
    patch: |-
      - op: replace
        path: /aggregationRule/clusterRoleSelectors/1/matchLabels/app.kubernetes.io~1instance
        value: kyverno
