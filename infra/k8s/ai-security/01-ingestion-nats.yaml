apiVersion: v1
kind: Namespace
metadata:
  name: ai-security
---
# NATS JetStream for high-throughput log ingestion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-ingestion
  namespace: ai-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.9-alpine
        args:
          - "-js" # Enable JetStream
        ports:
        - containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ai-security
spec:
  selector:
    app: nats
  ports:
  - port: 4222
    targetPort: 4222
