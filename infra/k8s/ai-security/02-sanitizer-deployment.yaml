apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sanitizer
  namespace: ai-security
spec:
  replicas: 2 # High availability
  selector:
    matchLabels:
      app: ai-sanitizer
  template:
    metadata:
      labels:
        app: ai-sanitizer
    spec:
      containers:
      - name: sanitizer
        image: python:3.11-slim
        command: ["python", "/app/main.py"]
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: ai-sanitizer-code
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-sanitizer-code
  namespace: ai-security
data:
  main.py: |
    # The actual content would be mounted here or baked into an image.
    import time
    print("AI Sanitizer running...")
    while True:
        time.sleep(60)
