# Falco Talon — Réponse automatique aux incidents de sécurité
# Déploie Falco Talon pour exécuter des actions automatiques
# en réponse aux alertes Falco (kill pod, taint node, notify).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-talon
  namespace: falco
  labels:
    app.kubernetes.io/name: falco-talon
    app.kubernetes.io/part-of: securerag-hub
spec:
  # Replicas set to 0: Falco Talon requires NATS (not yet deployed).
  # Will be enabled in Phase 1 when NATS is provisioned.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-talon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco-talon
    spec:
      serviceAccountName: falco-talon
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falco-talon
          image: issif/falco-talon:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -c
            - /etc/falco-talon/config.yaml
            - -r
            - /etc/falco-talon/rules.yaml
          ports:
            - name: http
              containerPort: 2803
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/falco-talon
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: falco-talon-config

---
# ConfigMap — Règles Falco Talon
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-talon-config
  namespace: falco
data:
  config.yaml: |
    listen:
      address: "0.0.0.0"
      port: 2803

    defaultNotifiers:
      - slack
      - loki

    notifiers:
      slack:
        webhookUrl: ""
      loki:
        host: http://loki.securerag-monitoring.svc:3100
        tenant: falco

  rules.yaml: |
    - action: Terminate Pod
      actionner: kubernetes:terminate
      continue: true
      match:
        rules:
          - SecureRAG Shell in Container
        priority: ">= Warning"
      parameters:
        grace_period_seconds: 5
      output:
        target: slack:message
        parameters:
          text: "POD KILLED: Shell detected in container."

    - action: Kill Privilege Escalation
      actionner: kubernetes:terminate
      continue: true
      match:
        rules:
          - SecureRAG Privilege Escalation Attempt
        priority: ">= Critical"
      parameters:
        grace_period_seconds: 0
      output:
        target: slack:message
        parameters:
          text: "CRITICAL: Privilege escalation attempt detected and neutralized."

    - action: Notify User Mutation
      actionner: kubernetes:terminate
      continue: false
      match:
        rules:
          - SecureRAG User Account Mutation
      output:
        target: slack:message
        parameters:
          text: "ALERT: Local user mutation detected in SecureRAG pod."

    - action: Notify Log Tampering
      actionner: kubernetes:terminate
      continue: false
      match:
        rules:
          - SecureRAG Log Tampering
      output:
        target: slack:message
        parameters:
          text: "ALERT: Log tampering detected in SecureRAG pod."

    - action: Kill Sensitive Read
      actionner: kubernetes:terminate
      continue: true
      match:
        rules:
          - SecureRAG Sensitive File Read
        priority: ">= Error"
      parameters:
        grace_period_seconds: 3
      output:
        target: slack:message
        parameters:
          text: "POD KILLED: Sensitive file access detected."

---
# RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-talon
  namespace: falco
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-talon
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-talon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-talon
subjects:
  - kind: ServiceAccount
    name: falco-talon
    namespace: falco
