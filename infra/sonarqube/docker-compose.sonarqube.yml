version: "3.8"

services:
  sonarqube:
    image: sonarqube:10-community
    container_name: securerag-sonarqube
    depends_on:
      - db-sonar
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db-sonar:5432/${POSTGRES_DB:-sonarqube}
      - SONAR_JDBC_USERNAME=${POSTGRES_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    networks:
      - sonar-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  db-sonar:
    image: postgres:15-alpine
    container_name: securerag-sonar-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sonar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sonar}
      - POSTGRES_DB=${POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - sonar-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

networks:
  sonar-network:
    driver: bridge
