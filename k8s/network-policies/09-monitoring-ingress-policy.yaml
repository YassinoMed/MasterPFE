apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-ingress-policy
  namespace: securerag-hub
spec:
  # Apply to all pods in the namespace to allow unified metrics scraping
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic from monitoring and observability namespaces
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - monitoring
                  - observability
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
