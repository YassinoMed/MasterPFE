apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-egress-policy
  namespace: securerag-hub
spec:
  # Apply to all pods in this namespace
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow outgoing traffic to kube-dns in kube-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
