apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chromadb-qdrant-policy
  namespace: securerag-hub
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - chromadb
          - qdrant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from chatbot-manager on database ports
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chatbot-manager
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 6333
  # Vector databases do not initiate outbound connections (leaf services)
  egress: []
