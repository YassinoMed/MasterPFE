apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conversation-service-policy
  namespace: securerag-hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: conversation-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from chatbot-manager
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chatbot-manager
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9000
  egress:
    # Allow outgoing database traffic to postgres-auth
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-auth
      ports:
        - protocol: TCP
          port: 5432
