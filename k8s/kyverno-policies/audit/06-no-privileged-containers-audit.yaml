apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-no-privileged-containers-audit
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers (Audit)
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers and privilege escalation are disallowed.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - recette
      validate:
        message: "Privileged containers are disallowed, and allowPrivilegeEscalation must be false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
