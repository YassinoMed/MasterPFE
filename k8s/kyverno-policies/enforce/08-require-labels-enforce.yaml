apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-require-labels-enforce
  annotations:
    policies.kyverno.io/title: Require Labels (Enforce)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must have labels app.kubernetes.io/name, app.kubernetes.io/version, and app.kubernetes.io/part-of: securerag-hub.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: require-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - recette
      validate:
        message: "Pods must have labels 'app.kubernetes.io/name', 'app.kubernetes.io/version', and 'app.kubernetes.io/part-of' set to 'securerag-hub'."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"
              app.kubernetes.io/part-of: "securerag-hub"
