apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-restrict-capabilities-enforce
  annotations:
    policies.kyverno.io/title: Restrict Capabilities (Enforce)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must drop ALL capabilities to enforce least privilege. Only NET_BIND_SERVICE may be added.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: restrict-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - recette
      validate:
        message: "Containers must drop ALL capabilities, and may only add NET_BIND_SERVICE."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
                    =(add):
                      - NET_BIND_SERVICE
            =(initContainers):
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
                    =(add):
                      - NET_BIND_SERVICE
