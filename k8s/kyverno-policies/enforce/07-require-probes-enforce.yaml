apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: securerag-require-probes-enforce
  annotations:
    policies.kyverno.io/title: Require Liveness and Readiness Probes (Enforce)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must have both liveness and readiness probes defined for all application containers.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: require-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - securerag-hub
                - recette
      validate:
        message: "Containers must have both livenessProbe and readinessProbe configured."
        pattern:
          spec:
            containers:
              - livenessProbe: {}
                readinessProbe: {}
