# ─────────────────────────────────────────────────────────────────
# AI Security Service — NetworkPolicy
# ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-security-netpol
  namespace: ai-security
  labels:
    app: ai-security-service
    app.kubernetes.io/part-of: securerag-hub
spec:
  podSelector:
    matchLabels:
      app: ai-security-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from Istio ingress gateway
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          app: istio-ingressgateway
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from API gateway in securerag-hub namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: securerag-hub
    ports:
    - protocol: TCP
      port: 8000
  # Allow Prometheus scraping from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: securerag-monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS for HuggingFace model downloads
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
