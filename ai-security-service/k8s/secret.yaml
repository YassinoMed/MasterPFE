# ─────────────────────────────────────────────────────────────────
# AI Security Service — Secret (template)
# In production, use SOPS+age or ExternalSecretsOperator
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ai-security-secrets
  namespace: ai-security
  labels:
    app: ai-security-service
    app.kubernetes.io/part-of: securerag-hub
  annotations:
    # SOPS encryption marker — encrypt before committing
    sops.mozilla.org/encrypted: "true"
type: Opaque
stringData:
  # HuggingFace API token for gated model downloads
  HF_TOKEN: "CHANGE_ME"
