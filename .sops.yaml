# SOPS configuration — SecureRAG Hub (Enterprise Edition)
#
# Architecture:
#   - age keys: ~/.config/sops/age/keys.txt (dev)
#   - age keys: Jenkins credential "sops-age-key" (CI/CD)
#   - age keys: Kubernetes Secret sops-age-key dans namespace argocd (GitOps)
#
# Workflow:
#   1. age-keygen -o ~/.config/sops/age/keys.txt
#   2. Copier la clé publique dans recipients ci-dessous
#   3. sops --encrypt infra/secrets/production/db.yaml
#   4. mv infra/secrets/production/db.yaml infra/secrets/production/db.enc.yaml
#   5. git add infra/secrets/production/db.enc.yaml
#   6. En CI/CD: sops --decrypt db.enc.yaml | kubectl apply -f -
#
# Rotation:
#   1. Généner nouvelle clé age
#   2. sops updatekeys -y infra/secrets/**/*.enc.yaml
#   3. Mettre à jour les clés dans Jenkins et ArgoCD

creation_rules:
  # Production secrets
  - path_regex: ^infra/secrets/production/.*\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1qy4mt3l6l4q4l4g5l6l7l8l9l0l1l2l3l4l5l6l7l8l9l0l1l2l3l4l5l6l7l8

  # Dev / demo secrets
  - path_regex: ^infra/secrets/(demo|dev)/.*\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1qy4mt3l6l4q4l4g5l6l7l8l9l0l1l2l3l4l5l6l7l8l9l0l1l2l3l4l5l6l7l8

  # Jenkins secrets
  - path_regex: ^infra/secrets/jenkins/.*\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1qy4mt3l6l4q4l4g5l6l7l8l9l0l1l2l3l4l5l6l7l8l9l0l1l2l3l4l5l6l7l8

  # Catch-all — force explicit rules
  - path_regex: \.enc\.ya?ml$
    age: ""
