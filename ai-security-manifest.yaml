apiVersion: v1
kind: Namespace
metadata:
  name: ai-security
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyberguard-sa
  namespace: ai-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberguard-ai-security-analyzer
  namespace: ai-security
  labels:
    app: cyberguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberguard
  template:
    metadata:
      labels:
        app: cyberguard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cyberguard-sa
      containers:
      - name: analyzer
        image: omasteam/cyberguard-ai-security-analyzer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: LOG_LEVEL
          value: "INFO"
---
apiVersion: v1
kind: Service
metadata:
  name: cyberguard-service
  namespace: ai-security
  labels:
    app: cyberguard
spec:
  selector:
    app: cyberguard
  ports:
  - port: 80
    targetPort: 8000
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyberguard-ingress
  namespace: ai-security
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: aisecurity.securerag.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cyberguard-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cyberguard-hpa
  namespace: ai-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cyberguard-ai-security-analyzer
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
