---
# File: .github/workflows/rotate-cosign.yml
# Description: Rotation des clés Cosign tous les 90 jours.
# Modified by: DevSecOps Agent — 2026-06-13

name: Cosign Key Rotation

'on':
  schedule:
    - cron: '0 0 1 */3 *'  # Tous les 90 jours environ
  workflow_dispatch:

jobs:
  rotate-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Setup SOPS
        uses: mdgreenwald/mozilla-sops-action@v1.6.0

      - name: Generate New Cosign Keys
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p security/keys/cosign/$(date +%Y-%m-%d)
          cd security/keys/cosign/$(date +%Y-%m-%d)
          cosign generate-key-pair

          # Chiffrement de la clé privée avec SOPS
          # (Nécessite que la configuration SOPS cible ce chemin via .sops.yaml)
          sops --encrypt --in-place cosign.key

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "sec(cosign): rotation des clés (90 jours)"
          title: "Rotation automatique des clés Cosign"
          body: |
            La rotation des clés Cosign est requise tous les 90 jours.
            Ce PR contient la nouvelle paire de clés générée et chiffrée
            par SOPS.

            **Actions requises :**
            1. Vérifier la nouvelle clé publique.
            2. Approuver et fusionner ce PR.
            3. Mettre à jour les secrets dans Jenkins/Vault si nécessaire.
          branch: "security/rotate-cosign-keys"
          labels: "security, automated"
