# Cleartext credential dans env -- audit-cleartext-env-values
apiVersion: v1
kind: Pod
metadata:
  name: neg-cleartext-env
  namespace: securerag-hub
  annotations:
    test/expect: REJECT
    test/policy: securerag-audit-cleartext-env-values
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: c
      image: ghcr.io/example/securerag-hub-portal-web@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      env:
        - name: DB_PASSWORD
          value: "supersecret123"   # interdit -- doit venir d'un Secret
