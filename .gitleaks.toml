title = "SecureRAG Hub Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow generated reports, documentation samples, and test fixtures with fake credentials."
paths = [
  '''(^|/)Parametres\.txt$''',
  '''(^|/)SRV_VPN_medysbneb\.ovpn$''',
  '''(^|/)TutoClientVPN\.docx$''',
  '''(^|/)tests/vpn_load_test\.py$''',
  '''(^|/)docs/security/.*''',
  '''(^|/)Me_moirePFE__3_/.*''',
  '''(^|/)scripts/ai-agents/.*''',
  '''(^|/)real-data/.*''',
  '''(^|/)\.coverage-artifacts/''',
  '''(^|/)security/reports/''',
  '''(^|/)security/adversarial/''',
  '''(^|/)security/secrets/\.env\.local$''',
  '''(^|/)security/secrets/\.env\.example$''',
  '''(^|/)tests/fixtures/''',
  '''(^|/)tests/security/fixtures/''',
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''(^|/)scripts/opensearch/''',
  '''(^|/)istio-1.23.0/''',
  '''(^|/)infra/jenkins/secrets/.*''',
  '''(^|/)evidence/.*''',
  '''(^|/)\.terraform/.*''',
  '''(^|/)reports/.*''',
  '''(^|/)artifacts/.*''',
  '''(^|/)support-pack/.*''',
  '''(^|/)\.kaniko-cache/.*''',
  '''(^|/)\.venv/.*''',
  '''(^|/)\.pytest_cache/.*''',
  '''(^|/)\.scannerwork/.*''',
  '''\.md$''',
  '''(^|/)infra/ansible/group_vars/all\.yml$''',
  '''(^|/)infra/k8s/argocd/application-harbor\.yaml$'''
]
regexes = [
  '''(?i)example[_-]?(token|secret|key|password)''',
  '''(?i)(dummy|fake|sample|test|changeme|not[-_]?real)[_-]?(token|secret|key|password)?''',
  '''(?i)admin:admin''',
  # Placeholder générique dans la config Alertmanager, ne correspond à aucun webhook réel — voir alertmanager.yaml ligne 10
  '''https://hooks\.slack\.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'''
]
